    }
	
	
	function addComponent(type, dropX = null, dropY = null) {
        const data = JL_DATABASE[type];
        let element;
        const rect = container.getBoundingClientRect();
        
        // --- ΕΞΥΠΝΟΣ ΥΠΟΛΟΓΙΣΜΟΣ ΘΕΣΗΣ (Κλικ vs Drag) ---
        let targetPos;
        if (dropX !== null && dropY !== null) {
            // Ήρθε από Drag & Drop: Μετατροπή των συντεταγμένων της οθόνης σε συντεταγμένες καμβά
            targetPos = paper.clientToLocalPoint({ x: dropX, y: dropY });
        } else {
            // Ήρθε από κλικ: Το βάζουμε στο κέντρο της οθόνης
            targetPos = paper.clientToLocalPoint({ x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 });
        }
        
        const snappedX = Math.round(targetPos.x / 10) * 10;
        const snappedY = Math.round(targetPos.y / 10) * 10;
		
		// *** NEW: The key to dynamic component styling ***
        const theme = THEME_COLORS[currentThemeName];
        
		if (type === 'connectordot') {
            element = new joint.shapes.jl.ConnectorDot();
            element.addPort({ id: 'p1', group: 'absolute', args: {x: 20, y: 20}, markup: '<g/>' });
            element.set({'latexMacro': 'connectordot', 'offsetX': -20, 'offsetY': -20});
            let snappedX = Math.round(targetPos.x / 40) * 40;
            let snappedY = Math.round(targetPos.y / 40) * 40;
            element.position(snappedX - 20, snappedY - 20);
			element.attr('dot/fill', theme.dot);
		} else {
			element = new joint.shapes.jl.Component();

            // --- NEW: Generate Arguments First ---
            let initialArgs = [];
            for (let i = 0; i < (data.argsCount || 7); i++) {
                let argDef = data.argNames && data.argNames[i] ? data.argNames[i].name : '';
                let defaultVal = argDef.includes('/') ? argDef.split('/')[0].trim() : '';
                if (data.argDefs) {
                    let customDefs = data.argDefs.filter(d => d.idx === (i + 1));
                    if (customDefs.length > 1) defaultVal = customDefs.map(d => d.defVal || "").join(', ');
                    else if (customDefs.length === 1) defaultVal = customDefs[0].defVal || "";
                }
                initialArgs.push(defaultVal);
            }
            if (data.previewArgs) {
                Object.keys(data.previewArgs).forEach(idx => { initialArgs[parseInt(idx) - 1] = data.previewArgs[idx]; });
            }

            // --- NEW: Evaluate JS Shape Generator on Drop ---
            let generatedDynamic = null;
            let rawIconPath = data.icon || data.iconBase || ''; 
            
            if (data.shapeGenerator) {
                try {
                    const buildShape = new Function('args', data.shapeGenerator);
                    // NEW: Pad the array so it is 1-indexed (args[1], args[2], etc.)
                    let jsArgs = ["", ...initialArgs];
                    generatedDynamic = buildShape(jsArgs);
                    rawIconPath = generatedDynamic.pathStr;
                    
                    // NEW: Scale the physical pins to the CAD PPU multiplier
                    if (generatedDynamic.pins) {
                        generatedDynamic.pins.forEach(p => { p.x *= PPU_MULT; p.y *= PPU_MULT; });
                    }
                } catch(e) { console.error("Shape Gen Error on Drop:", e); }
            }

            let extractedInit = extractStaticTexts(rawIconPath);
            let iconPath = extractedInit.cleanPath;

            // Use the newly generated JS pins if they exist, otherwise fallback to static .sty pins
            const sourcePins = (generatedDynamic && generatedDynamic.pins) ? generatedDynamic.pins : data.pins;
            const uniquePins = [];
            const seenIds = new Set();
            sourcePins.forEach(p => {
                let isDynamicText = p.id && p.id.includes('$'); 
                if (isDynamicText || !seenIds.has(p.id)) { 
                    if (!isDynamicText) seenIds.add(p.id); 
                    uniquePins.push({ ...p });
                } else {
                    const existing = uniquePins.find(up => up.id === p.id);
                    if (existing && !existing.label && p.label) existing.label = p.label;
                }
            });
            // ----------------------------------

            // Use the freshly generated clean path for measurement!
            let measurePath = iconPath;

            // Bulletproof SVG Measurement
            let bbox = { x: 0, y: 0, width: 0, height: 0 };
            if (measurePath) {
                const tempSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                const tempPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                tempPath.setAttribute('d', measurePath);
                // Removed the scaling transform here to prevent browser calculation bugs
                tempSvg.appendChild(tempPath);
                Object.assign(tempSvg.style, { position: 'absolute', top: '-9999px', opacity: 0.01, pointerEvents: 'none' });
                document.body.appendChild(tempSvg);
                try { bbox = tempPath.getBBox(); } catch(e){}
                document.body.removeChild(tempSvg);
            }

            // Calculate Absolute Limits based on the correct PPU_MULT
            const xs = uniquePins.map(p => p.x), ys = uniquePins.map(p => p.y);
            const minPinX = xs.length ? Math.min(...xs) : 0; const maxPinX = xs.length ? Math.max(...xs) : 0;
            const minPinY = ys.length ? Math.min(...ys) : 0; const maxPinY = ys.length ? Math.max(...ys) : 0;

            let hasBounds = bbox.width > 0 || bbox.height > 0;
            const absMinX = hasBounds ? Math.min(minPinX, bbox.x * PPU_MULT) : minPinX;
            const absMaxX = hasBounds ? Math.max(maxPinX, (bbox.x + bbox.width) * PPU_MULT) : maxPinX;
            const absMinY = hasBounds ? Math.min(minPinY, bbox.y * PPU_MULT) : minPinY;
            const absMaxY = hasBounds ? Math.max(maxPinY, (bbox.y + bbox.height) * PPU_MULT) : maxPinY;
                
            // Snapping Bounding Box to the 40px Grid
            const pad = 10; 
            const boxOriginX = Math.floor((absMinX - pad) / 40) * 40;
            const boxOriginY = Math.floor((absMinY - pad) / 40) * 40;
            const boxMaxX = Math.ceil((absMaxX + pad) / 40) * 40;
            const boxMaxY = Math.ceil((absMaxY + pad) / 40) * 40;

            const boxWidth = Math.max(boxMaxX - boxOriginX, 40);
            const boxHeight = Math.max(boxMaxY - boxOriginY, 40);

            const shiftX = -boxOriginX;
            const shiftY = -boxOriginY;

			// --- NEW: Διάβασμα του iconBaseStyle για το πάχος και το χρώμα ---
            let baseStrokeWidth = 1.8; // Το default
            let baseStrokeColor = theme.componentIcon; // Το default από το theme

            if (data.iconBaseStyle) {
                if (data.iconBaseStyle.includes('stroke-width=')) {
                    baseStrokeWidth = parseFloat(data.iconBaseStyle.match(/stroke-width=([\d\.]+)/)[1]);
                }
                if (data.iconBaseStyle.includes('stroke=')) {
                    baseStrokeColor = data.iconBaseStyle.match(/stroke=([^,\]]+)/)[1].trim();
                }
            }

            element.resize(boxWidth, boxHeight);
            element.attr({ 
                body: { fill: '#ffffff', fillOpacity: 0.01, stroke: 'none', 'pointer-events': 'all', cursor: 'pointer' },
                // Apply transform to the whole group!
                iconGroup: {
                    transform: `translate(${shiftX}, ${shiftY}) scale(${PPU_MULT})`
                },
                iconFill: {
                    d: iconPath, 
                    stroke: 'none',
                    fill: data.filled ? theme.componentIcon : 'transparent', 
                    'fill-rule': 'evenodd'
                },
                iconStroke: {
                    d: iconPath, 
                    stroke: baseStrokeColor,        
                    strokeWidth: baseStrokeWidth,   
                    fill: 'transparent'
                },
                label: { 
                    text: data.name, fontSize: 12 * PPU_MULT, fill: theme.componentLabel,
                    refX: '50%', textAnchor: 'middle', refY: '50%', refY2: 25 * PPU_MULT, 'pointer-events': 'none'
                }
            });
			
			// Αν είναι το εργαλείο Κειμένου, κρύβουμε το εικονίδιο και κεντράρουμε το κείμενο!
            if (type === 'freetext') {
                element.attr('iconStroke/stroke', 'transparent'); // Κάνουμε το "T" αόρατο
                element.attr('label/refY', '50%');          // Το φέρνουμε ακριβώς στο κέντρο
                element.attr('label/refY2', 0);
                element.attr('label/fontSize', 14 * PPU_MULT); // Λίγο πιο μεγάλο
            }

            // --- ΔΙΑΧΩΡΙΣΜΟΣ: ΠΡΑΓΜΑΤΙΚΑ PINS vs DYNAMIC LABELS ---
            const realPins = [];
            const dynamicLabels = [];

            uniquePins.forEach(p => {
                let rawLabel = p.label || p.id;
                if (rawLabel.includes('$')) {
                    dynamicLabels.push(p); // Είναι απλό κείμενο
                } else {
                    realPins.push(p);      // Είναι κανονικό pin
                }
            });

            const ports = realPins.map(p => ({ 
                id: p.id, group: 'absolute', 
                args: { x: p.x + shiftX, y: p.y + shiftY }, 
				condition: p.condition, // ΝΕΟ! Περνάει τη συνθήκη
                markup: [
                    { tagName: 'rect', selector: 'portBody' },
                    { tagName: 'title', selector: 'portTitle' }, 
                    { tagName: 'text', selector: 'portLabel' }   
                ],
                attrs: { 
                    portBody: { 
						width: 8 * PPU_MULT, 
						height: 8 * PPU_MULT, 
						x: -4 * PPU_MULT, 
						y: -4 * PPU_MULT, 
						fill: theme.portBody,
						display: showComponentPins ? 'block' : 'none'
					},
                    portTitle: { text: p.label || p.id },
                    portLabel: { 
                        text: p.label || '', display: showPinNames ? 'block' : 'none',
                        fontSize: 9 * PPU_MULT, fill: theme.portLabel, 
                        fontWeight: 'bold', fontFamily: 'monospace',
                        x: 6 * PPU_MULT, y: -6 * PPU_MULT, textAnchor: 'start' 
                    }

            // Αποθήκευση των "Αρχικών" θέσεων των pins για τέλειο Scaling
            let basePorts = {};
            ports.forEach(p => { basePorts[p.id] = { x: p.args.x - shiftX, y: p.args.y - shiftY }; });

            element.prop('ports', { groups: { 'absolute': { position: { name: 'absolute' } } } });
            element.addPorts(ports);
            
            // Apply the smart preview overrides so it drops exactly like it looks in the palette!
            if (data.previewArgs) {
                Object.keys(data.previewArgs).forEach(idx => {
                    initialArgs[parseInt(idx) - 1] = data.previewArgs[idx];
                });
            }

            element.set({
                'latexMacro': data.name, 
                'offsetX': boxOriginX, 'offsetY': boxOriginY,
                'shiftX': shiftX, 'shiftY': shiftY,
                'flipH': false, 'flipV': false,
                'customArgs': initialArgs, // <--- FIX: Inject the smart defaults!
                'customScale': 1,
                'baseWidth': boxWidth, 'baseHeight': boxHeight,
                'baseOffsetX': boxOriginX, 'baseOffsetY': boxOriginY,
                'baseShiftX': shiftX, 'baseShiftY': shiftY,
                'basePorts': basePorts,
                'baseVisualTop': absMinY - boxOriginY,
                'baseVisualBottom': absMaxY - boxOriginY,
                'baseVisualLeft': absMinX - boxOriginX,
                'baseVisualRight': absMaxX - boxOriginX,
				'dynamicLabels': dynamicLabels
            });
            
			// ΑΠΟΛΥΤΟ SNAPPING: Κουμπώνουμε το μαθηματικό (0,0) στα 40px
            let snappedOriginX = Math.round(targetPos.x / 40) * 40;
            let snappedOriginY = Math.round(targetPos.y / 40) * 40;
            
            // Η τελική θέση (πάνω αριστερή γωνία του box) 
            let finalX = snappedOriginX - shiftX;
            let finalY = snappedOriginY - shiftY;
            
            if (type === 'freetext') element.attr('icon/stroke', 'transparent'); 
            updateElementLabel(element, data.name); 
            
            element.position(finalX, finalY);
			// --- NEW: Assemble layers on drop! ---
				assembleIcon(element, element.get('customArgs') || []);
        }
        graph.addCell(element); clearSelection(); selectedElements.push(element);
        setTimeout(() => { const v = paper.findViewByModel(element); if(v) v.highlight(); }, 10);

    $('#tool-draw').click(function() { $('#draw-glasspane').show(); $('.tool-btn').removeClass('active'); $(this).addClass('active'); });

    let drawing = false, wire = null;
    $('#draw-glasspane').on('mousedown', function(e) {
        drawing = true;
        let p = paper.clientToLocalPoint({x: e.clientX, y: e.clientY});
        let snap = e.altKey ? 10 : 40; // 10px precision if Alt is held
        let s = { x: Math.round(p.x/snap)*snap, y: Math.round(p.y/snap)*snap }; 
        const theme = THEME_COLORS[currentThemeName];
        
        wire = new joint.shapes.standard.Link({ 
            source: s, 
            target: s, 
            attrs: { 
                line: { 
                    stroke: theme.wire, 
                    strokeWidth: 1.8, // Σκέτο 1.8
                    targetMarker: null,
                    'vector-effect': 'non-scaling-stroke' // <--- Η μαγική ιδιότητα
                } 
            } 
        });
        wire.addTo(graph);
    });
    
    $(document).on('mousemove', function(e) {
        if (!drawing) return;
        let p = paper.clientToLocalPoint({x: e.clientX, y: e.clientY});
        let snap = e.altKey ? 10 : 40;
        let tx = Math.round(p.x/snap)*snap, ty = Math.round(p.y/snap)*snap;
        let s = wire.source();
        
        if (e.altKey) {
            // Free angle (diagonal routing) when Alt is held
            wire.target({ x: tx, y: ty }, { snapping: true });
        } else {
            // Standard CAD Orthogonal routing
            if (Math.abs(tx - s.x) > Math.abs(ty - s.y)) wire.target({ x: tx, y: s.y }, { snapping: true });
            else wire.target({ x: s.x, y: ty }, { snapping: true });
        }
    }).on('mouseup', function() { 
        if (drawing) { 
            drawing = false; 
            if (wire) {
                // ΑΝ ΤΟ ΚΑΛΩΔΙΟ ΕΧΕΙ ΜΗΚΟΣ ΜΗΔΕΝ, ΚΑΤΑΣΤΡΕΨΕ ΤΟ!
                if (wire.source().x === wire.target().x && wire.source().y === wire.target().y) {
                    wire.remove();
                } else {
                    wire.toBack(); 
                    exportLatex();
                    saveState(); 
                }
            }           
        } 
    });

    // --- 7. EXPORT HTML/TEXT & CODE HIGHLIGHTING ---
    function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])); }

	// ΝΕΑ ΣΥΝΑΡΤΗΣΗ: Εφαρμόζει χρώματα στον κώδικα
    function highlightLatex(text) {
        let html = text;
        // 1. Βάφει τις εντολές (π.χ. \draw, \connectordot)
        html = html.replace(/(\\[a-zA-Z]+)/g, '<span class="tex-cmd">$1</span>');
        // 2. Βάφει τα placeholders και το $NAME$
        html = html.replace(/(\$NAME\$|\{\.\.\.\}|type "[^"]+" to [^}]+)/g, '<span class="tex-place">$1</span>');
		// 3. Βάφει τις αγκύλες {} και []
        html = html.replace(/([{}\[\]])/g, '<span class="tex-brace">$1</span>');
        return html;
    }

	function exportLatex() {
        // Αν ΔΕΝ έχει πειραχτεί ο κώδικας Ή έχει τσεκαριστεί το "Μην με ξαναρωτήσεις"
        if (!latexEdited || suppressWarning) {
            forceExportLatex();
            return;
        }

        // Αν το παράθυρο είναι ήδη ανοιχτό, αγνοούμε τα πολλαπλά events (πχ κατά το σύρσιμο)
        if (isSwalOpen) return;

        isSwalOpen = true;
        Swal.fire({
            title: 'Warning: Manually-entered code!',
            html: `
                <p style="font-size: 14px; color: #34495e;">You have made manual edits to the LaTeX code.<br>If the code is updated from the canvas, your changes will be <b>deleted</b>.</p>
                <label style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 15px; font-size: 13px; cursor: pointer;">
                    <input type="checkbox" id="swal-dont-ask" style="width: 16px; height: 16px;">
                    Don't ask me again (for this session)
                </label>
            `,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#e74c3c',
            cancelButtonColor: '#95a5a6',
            confirmButtonText: 'Yes, Overwrite',
            cancelButtonText: 'Keep my changes',
			preConfirm: () => {
                // Επιστρέφουμε ένα object ώστε το Swal να μην το δει ποτέ ως 'false'
                return { isChecked: document.getElementById('swal-dont-ask').checked };
            }
        }).then((result) => {
            isSwalOpen = false;
            if (result.isConfirmed) {
                // Αν ο χρήστης πάτησε "Ναι, Overwrite"
                if (result.value && result.value.isChecked) {
                    suppressWarning = true; // Αποθηκεύουμε την επιλογή του Checkbox
                }
                forceExportLatex(); // Κάνουμε την εξαγωγή
            }
        });
    }

    function forceExportLatex() {
		latexEdited = false;
        let outText = "\\begin{tikzpictureJL}\n";
        let outHTML = "\\begin{tikzpictureJL}\n";
        const isSelected = (id) => selectedElements.some(e=>e.id===id) || selectedLinks.some(l=>l.id===id);

		graph.getElements().forEach(el => {
            const p = el.position(), macro = el.get('latexMacro');
            let line = "";
            let htmlBlock = ""; // Εδώ θα χτίσουμε το ασφαλές HTML

            if (macro === 'connectordot') {
                let cleanDotLine = "  \\connectordot{(" + ((p.x + 20) / EXPORT_DIV).toFixed(2) + "," + (-(p.y + 20) / EXPORT_DIV).toFixed(2) + ")}";
                let idStr = ` % id:${el.id}`;
                let htmlIdSpan = `<span class="sync-id" contenteditable="false">${idStr}</span>`;
                
                line = cleanDotLine + idStr + "\n";
                htmlBlock = highlightLatex(escapeHTML(cleanDotLine)) + htmlIdSpan + "\n";
            } else {
                // --- ΕΞΥΠΝΟΣ ΥΠΟΛΟΓΙΣΜΟΣ OFFSET ΓΙΑ FLIP & ROTATION ---
                const visOrg = getVisualOrigin(el);
                const tx = (Math.round(visOrg.x) / EXPORT_DIV).toFixed(2);
                const ty = (-(Math.round(visOrg.y)) / EXPORT_DIV).toFixed(2);
                
                // --- THE FIX: Convert Clockwise (Web) to Counter-Clockwise (TikZ) ---
                let rawAngle = el.get('angle') || 0;
                const rot = (360 - rawAngle) % 360;
                
                const flipH = el.get('flipH') || false;
                const flipV = el.get('flipV') || false;
                let flipStr = 'none';
                if (flipH && flipV) flipStr = 'hv';
                else if (flipH) flipStr = 'h';
                else if (flipV) flipStr = 'v';

                const data = JL_DATABASE[macro];
                const argsCount = (data && data.argsCount) ? data.argsCount : 7;
                const argNames = (data && data.argNames) ? data.argNames : [];
                
                let actualArgs = []; // Αποθηκεύει τις ΠΡΑΓΜΑΤΙΚΕΣ τιμές
                let args = [];
                for (let i = 0; i < argsCount; i++) {
                    let argDef = argNames[i] || { name: '', optional: false };
                    let desc = argDef.name.toLowerCase();
                    let isOpt = argDef.optional;
                    
                    let customArgs = el.get('customArgs') || [];
                    let innerVal = "...";

                    if (desc.includes('position')) {
                        innerVal = `(${tx},${ty})`;
                    } else if (desc.includes('rotation') && desc.includes('flip')) {
                        innerVal = `${rot},${flipStr}`;
                    } else if (desc.includes('rotation') || desc.includes('angle')) {
                        innerVal = `${rot}`;            
                    } else if (desc.includes('flip')) {
                        innerVal = `${flipStr}`;        
                    } else {
                        if (customArgs[i] !== undefined) {
                            innerVal = customArgs[i];
                        } else {
                            if (desc === 'name') innerVal = `$NAME$`;
                            else if (desc === 'text') innerVal = ``; 
                            else if (desc.includes('grid')) innerVal = `type "gridon" to show grid`;
                            else if (desc.includes('show')) innerVal = `type "show" to display (0,0)`;
                            else if (argDef.name.includes('/')) innerVal = argDef.name.split('/')[0].trim(); 
                            else innerVal = argDef.name ? argDef.name : "...";
                        }
                    }
                    
                    // --- ΛΥΣΗ 1a: Κρατάμε την πραγματική τιμή για τα Pins ---
                    let realName = innerVal;
                    if (desc === 'name' || desc === 'text') {
                        if (realName === '$NAME$' || realName === '') realName = el.get('displayedText') || data.name;
                    }
                    actualArgs.push(realName);

                    // --- ΛΥΣΗ 1b: Αδειάζουμε την τιμή ΜΟΝΟ για την LaTeX macro ---
                    let exportVal = innerVal;

                    if (isOpt) args.push(`[${exportVal}]`);
                    else args.push(`{${exportVal}}`);
                }

                // --- ΕΞΑΓΩΓΗ MACRO ΚΑΙ ΑΟΡΑΤΟΥ ID ---
                let currentScale = el.get('customScale') || 1;
                let cleanMacroLine = "  \\" + macro + args.join("");
                let idStr = ` % id:${el.id}`;
                let htmlIdSpan = `<span class="sync-id" contenteditable="false">${idStr}</span>`;

                let finalRawLine = cleanMacroLine + idStr + "\n";
                let finalHtmlLine = highlightLatex(escapeHTML(cleanMacroLine)) + htmlIdSpan + "\n";

                if (currentScale !== 1) {
                    let scaleOn = `  \\setscale{${currentScale}}\n`;
                    let scaleOff = `  \\setscale{1}\n`;
                    line = scaleOn + finalRawLine + scaleOff;
                    
                    htmlBlock = highlightLatex(escapeHTML(scaleOn)) + finalHtmlLine + highlightLatex(escapeHTML(scaleOff));
                } else {
                    line = finalRawLine;
                    htmlBlock = finalHtmlLine;
                }
            } // Τέλος της μεγάλης else

            outText += line;
            if (isSelected(el.id)) outHTML += `<span class="highlight">${htmlBlock}</span>`;
            else outHTML += htmlBlock;
        });

		let segments = [];
        graph.getLinks().forEach(link => {
            let pts = [link.getSourcePoint(), ...(link.vertices() || []), link.getTargetPoint()];
            for (let i = 0; i < pts.length - 1; i++) {
                // Απόλυτη στρογγυλοποίηση στον κοντινότερο ακέραιο της δεκάδας 
                // για να "κουμπώνουν" τέλεια τα καλώδια στα pins
					let x1 = ((Math.round(pts[i].x / 10) * 10) / EXPORT_DIV).toFixed(2);
					let y1 = ((Math.round(-pts[i].y / 10) * 10) / EXPORT_DIV).toFixed(2);
					let x2 = ((Math.round(pts[i+1].x / 10) * 10) / EXPORT_DIV).toFixed(2);
					let y2 = ((Math.round(-pts[i+1].y / 10) * 10) / EXPORT_DIV).toFixed(2);
                
                segments.push({ 
                    linkId: link.id, 
                    p1: `${x1},${y1}`, 
                    p2: `${x2},${y2}` 
                });
            }
        });

        let paths = [];
        while (segments.length > 0) {
            let seg = segments.shift();
            let currentPath = [seg.p1, seg.p2], currentLinkIds = new Set([seg.linkId]), added = true;
            while (added) {
                added = false;
                for (let i = 0; i < segments.length; i++) {
                    let s = segments[i];
                    if (s.p1 === currentPath[currentPath.length - 1]) { currentPath.push(s.p2); currentLinkIds.add(s.linkId); segments.splice(i, 1); added = true; break; } 
                    else if (s.p2 === currentPath[currentPath.length - 1]) { currentPath.push(s.p1); currentLinkIds.add(s.linkId); segments.splice(i, 1); added = true; break; } 
                    else if (s.p2 === currentPath[0]) { currentPath.unshift(s.p1); currentLinkIds.add(s.linkId); segments.splice(i, 1); added = true; break; } 
                    else if (s.p1 === currentPath[0]) { currentPath.unshift(s.p2); currentLinkIds.add(s.linkId); segments.splice(i, 1); added = true; break; }
                }
            }
            paths.push({ points: currentPath, linkIds: Array.from(currentLinkIds) });
        }

        paths.forEach(pathObj => {
            // Προσθήκη του line cap=round, line join=round για να δένουν τέλεια οι κάθετες ενώσεις!
            let line = "  \\draw[line cap=round, line join=round] (" + pathObj.points.join(") -- (") + ");\n";
            outText += line;
            let safeLine = highlightLatex(escapeHTML(line));
            if (pathObj.linkIds.some(id => isSelected(id))) outHTML += `<span class="highlight">${safeLine}</span>`;
            else outHTML += safeLine;
        });

        outText += "\\end{tikzpictureJL}";
        outHTML += "\\end{tikzpictureJL}";
        
		window.rawLatexCode = outText; 
        document.getElementById('latex-output').innerHTML = outHTML;
        
        // --- ΝΕΟ: Αυτόματο Scroll στο Highlight ---
        setTimeout(() => {
            const highlightedEl = document.querySelector('#latex-output .highlight');
            if (highlightedEl) {
                // Το block: 'center' το φέρνει όμορφα στη μέση του παραθύρου!
                highlightedEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }, 50); // Δίνουμε 50ms περιθώριο στον browser να "χωνέψει" το νέο HTML
    }

	// --- 8. SAVE / LOAD / DOWNLOAD (ΜΕ NATIVE SAVE DIALOG) ---

    // Νέα έξυπνη συνάρτηση που καλεί το "Save As" του λειτουργικού
    async function saveFileAs(content, defaultFilename, mimeType, description) {
        // Ελέγχουμε αν ο browser υποστηρίζει το σύγχρονο File System API (Chrome, Edge, Opera)
        if (window.showSaveFilePicker) {
            try {
                const handle = await window.showSaveFilePicker({
                    suggestedName: defaultFilename,
                    types: [{
                        description: description,
                        accept: { [mimeType]: [defaultFilename.substring(defaultFilename.lastIndexOf('.'))] },
                    }],
                });
                const writable = await handle.createWritable();
                await writable.write(content);
                await writable.close();
            } catch (err) {
                // Ο χρήστης πάτησε "Ακύρωση" στο παράθυρο, δεν κάνουμε τίποτα.
                if (err.name !== 'AbortError') console.error('Αποτυχία αποθήκευσης:', err);
            }
        } else {
            // Fallback για Firefox / Safari (κλασικό κατέβασμα)
            const blob = new Blob([content], { type: mimeType });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = defaultFilename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
        }
    }

    function saveProject() { 
        const currentLatex = document.getElementById('latex-output').innerText;
        graph.set('customLatex', currentLatex);
        
        const jsonString = JSON.stringify(graph.toJSON());
        saveFileAs(jsonString, 'circuit.json', 'application/json', 'JointJS Diagram');
        
        // --- NEW: Wipe the auto-save memory after a successful manual save ---
        localStorage.removeItem('jlcad_autosave');
    }

	function downloadLatex(isStandalone = false) {
        runLinterUI((textToDownload) => {
            let finalOutput = textToDownload;
            let filename = 'circuit.tex';

            if (isStandalone) {
                filename = 'circuit_standalone.tex';
                
                // 1. Προσθήκη του scale στο tikzpicture
                let scaledTikz = textToDownload.replace('\\begin{tikzpictureJL}', '\\begin{tikzpictureJL}[scale=0.245]');
                
                // 2. Εφαρμογή indentation (ένα tab) σε όλες τις γραμμές του παραγόμενου κώδικα
                let indentedTikz = scaledTikz.split('\n').map(line => '\t' + line).join('\n');

                // 3. Δημιουργία του τελικού Standalone με τα σωστά tabs
                finalOutput = `\\documentclass{standalone}

\t% Required packages for the style file
\t\\usepackage{amsmath}
\t\\usepackage{tikz}
\t\\usepackage{xstring}
\t\\usepackage{xparse}
\t\\usepackage{etoolbox}
\t\\usepackage{calculator}
\t\\usepackage{accents}
\t\\usepackage{xcolor}

\t% Load your specific electronic parts style file
\t\\usepackage{tikz_electronic_parts}
\t\\standaloneenv{tikzpictureJL} 

\t\\begin{document}
\t\\settikzlinewidth{1.2}
\t\\tikzset{every picture/.style={line width=\\tikzlinewidth}}

${indentedTikz}

\t\\end{document}`;
            }

            // Κλήση του έξυπνου Save Dialog
            saveFileAs(finalOutput, filename, 'text/plain', 'LaTeX Document');
        });
    }

                freetext: document.getElementById('exp-freetext').checked,
                mono: document.getElementById('exp-mono').checked,
                weightScale: parseFloat(document.getElementById('exp-weight-scale').value) || 1.0
            };
        }
    }).then((result) => {
        if (result.isConfirmed) {
            if (result.value.format === 'svg') {
                downloadAdvancedSVG(result.value);
            } else if (result.value.format === 'tikz') {
                downloadLatex(false);
            } else if (result.value.format === 'standalone') {
                downloadLatex(true);
            }
        }
    });
}

// --- ADVANCED SVG EXPORT (WITH FILTERS) ---
    function downloadAdvancedSVG(options) {
        // --- 1. ΥΠΟΛΟΓΙΣΜΟΣ ΒΑΣΙΚΩΝ ΟΡΙΩΝ ΜΟΝΤΕΛΟΥ ---
        const bbox = paper.getContentBBox({ useModelGeometry: true }); 
        if (!bbox || bbox.width === 0 || bbox.height === 0) {
            Swal.fire({ icon: 'info', title: 'Empty Canvas', text: 'There is nothing to export.'});
            return;
        }

        // Προσθέτουμε padding για τα labels στο export
        const expPadding = 120;
        const x = bbox.x - expPadding;
        const y = bbox.y - expPadding;
        const width = bbox.width + expPadding * 2;
        const height = bbox.height + expPadding * 2;

        // --- 2. ΚΛΩΝΟΠΟΙΗΣΗ ΚΑΙ ΚΑΘΑΡΙΣΜΟΣ ΤΟΥ SVG ---
        const svgNode = paper.svg.cloneNode(true);
        const viewport = svgNode.querySelector('.viewport');
        if (viewport) viewport.removeAttribute('transform');

        // Το viewBox ορίζει το "κάδρο". Τώρα είναι ευθυγραμμισμένο με το περιεχόμενο.
        svgNode.setAttribute('viewBox', `${x} ${y} ${width} ${height}`);
        svgNode.setAttribute('width', width);
        svgNode.setAttribute('height', height);

        // Καθαρισμός highlights
        svgNode.querySelectorAll('.joint-highlighted, .joint-selection-rect, [class*="highlight"]').forEach(el => el.remove());

        // B. Apply Global Line Weight Scale, Standardize Vector Effects & Force Pure Black
        const scaleFactor = options.weightScale;
        const baseThickness = 1.8; // <--- ΕΔΩ ΕΙΝΑΙ Η ΔΙΟΡΘΩΣΗ ΠΟΥ ΕΛΕΙΠΕ!

        // 1. Ρύθμιση των Καλωδίων (Wires)
        svgNode.querySelectorAll('path[joint-selector="line"]').forEach(n => {
            n.setAttribute('stroke-width', (baseThickness * PPU_MULT) * scaleFactor);
            n.setAttribute('stroke', '#000000'); // <--- ΕΔΩ: Κατάμαυρο καλώδιο
            n.setAttribute('stroke-linejoin', 'round');
            n.setAttribute('stroke-linecap', 'round');
			// --- Η ΝΕΑ ΠΡΟΣΘΗΚΗ: Καθαρίζουμε το vector-effect και από τα καλώδια! ---
            n.removeAttribute('vector-effect');
            if (n.style.vectorEffect) n.style.vectorEffect = '';
        });

        // 2. Ρύθμιση όλων των υπόλοιπων σχημάτων (Components/Symbols)
        svgNode.querySelectorAll('path, rect, circle, ellipse, polygon, polyline').forEach(n => {
            if (n.getAttribute('joint-selector') === 'line') return; 
            if (n.tagName.toLowerCase() === 'text' || n.closest('text') || n.closest('foreignObject')) return;

            // Αφαίρεση vector-effect για συμβατότητα
            n.removeAttribute('vector-effect');
            if (n.style.vectorEffect) n.style.vectorEffect = '';

            // ΕΔΩ: Επιβολή απόλυτου μαύρου στο περίγραμμα (Stroke)
            if (n.getAttribute('stroke') && n.getAttribute('stroke') !== 'none' && n.getAttribute('stroke') !== 'transparent') {
                n.setAttribute('stroke', '#000000');
            }
            
            // ΕΔΩ: Επιβολή απόλυτου μαύρου στο γέμισμα 
            if (n.getAttribute('fill') && n.getAttribute('fill') !== 'none' && n.getAttribute('fill') !== 'transparent' && n.getAttribute('fill') !== '#ffffff') {
                n.setAttribute('fill', '#000000');
            }

            // ΔΙΟΡΘΩΣΗ: Αντί για σταθερό πάχος, κλιμακώνουμε το υπάρχον
			let currentWidthAttr = n.getAttribute('stroke-width');
			if (currentWidthAttr && currentWidthAttr !== 'none' && currentWidthAttr !== '0') {
				let currentWidth = parseFloat(currentWidthAttr);
				// Πολλαπλασιάζουμε το πάχος που ήδη έχει το σύμβολο με το scaleFactor του χρήστη
				n.setAttribute('stroke-width', currentWidth * scaleFactor);
			}
		});

        // -- APPLY VISUAL FILTERS --

        // 1. Free Text
        if (!options.freetext) {
            graph.getElements().filter(e => e.get('latexMacro') === 'freetext').forEach(e => {
                let node = svgNode.querySelector(`[model-id="${e.id}"]`);
                if (node) node.remove();
            });
        }

        // 2. Component Names (Label and KaTeX foreignObject)
        if (!options.compnames) {
            graph.getElements().filter(e => e.get('latexMacro') !== 'freetext' && e.get('latexMacro') !== 'connectordot').forEach(e => {
                let node = svgNode.querySelector(`[model-id="${e.id}"]`);
                if (node) {
                    let label = node.querySelector('text[joint-selector="label"]');
                    if (label) label.remove();
                    let fo = node.querySelector('foreignObject');
                    if (fo) fo.remove();
                }
            });
        }

        // 3. Pins (Orange Boxes)
        if (!options.pins) {
            svgNode.querySelectorAll('[joint-selector="portBody"]').forEach(n => n.remove());
        }

        // 4. Pin Names
        if (!options.pinnames) {
            svgNode.querySelectorAll('[joint-selector="portLabel"]').forEach(n => n.remove());
        }

        // 5. Monochrome (Black & White)
        if (options.mono) {
            svgNode.querySelectorAll('*').forEach(n => {
                let stroke = n.getAttribute('stroke');
                let fill = n.getAttribute('fill');
                
                if (stroke && stroke !== 'none' && stroke !== 'transparent') n.setAttribute('stroke', '#000000');
                
                if (fill && fill !== 'none' && fill !== 'transparent' && fill.toLowerCase() !== '#ffffff' && n.getAttribute('fill-opacity') !== '0.01') {
                    n.setAttribute('fill', '#000000');
                }
                
                if (n.tagName === 'div' || n.tagName === 'span') n.style.color = '#000000'; 
            });
        }

        // 6. Grid
        if (options.grid) {
            let defs = svgNode.querySelector('defs') || document.createElementNS("http://www.w3.org/2000/svg", "defs");
            if (!svgNode.querySelector('defs')) svgNode.prepend(defs);
            
            let pattern = document.createElementNS("http://www.w3.org/2000/svg", "pattern");
            pattern.setAttribute("id", "exportGrid");
            pattern.setAttribute("width", "40");
            pattern.setAttribute("height", "40");
            pattern.setAttribute("patternUnits", "userSpaceOnUse");
            
            let circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", "0");
            circle.setAttribute("cy", "0");
            circle.setAttribute("r", "1.5");
            circle.setAttribute("fill", options.mono ? "#cccccc" : "#bdc3c7"); 
            
            pattern.appendChild(circle);
            defs.appendChild(pattern);
            
            let gridRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            gridRect.setAttribute("x", x);
            gridRect.setAttribute("y", y);
            gridRect.setAttribute("width", width);
            gridRect.setAttribute("height", height);
            gridRect.setAttribute("fill", "url(#exportGrid)");
            
            svgNode.insertBefore(gridRect, viewport); 
        }
        
        // --- FIX: Διόρθωση εμφάνισης Math (KaTeX) και Clipping στο SVG ---
        
        // 1. Ενσωμάτωση του CSS για να διαβάζονται οι μαθηματικές γραμματοσειρές (KaTeX)
        let styleTag = document.createElementNS("http://www.w3.org/2000/svg", "style");
        styleTag.textContent = "@import url('https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css');";
        svgNode.insertBefore(styleTag, svgNode.firstChild);

        // 2. Διόρθωση των foreignObject για KaTeX χωρίς το παλιό translation hack
        svgNode.querySelectorAll('foreignObject').forEach(fo => {
            fo.setAttribute('width', '500'); 
            fo.setAttribute('height', '500');
            fo.style.overflow = 'visible';
            
            let innerDiv = fo.firstElementChild;
            if (innerDiv) {
                innerDiv.style.overflow = 'visible';
                innerDiv.style.display = 'inline-block';
                innerDiv.style.whiteSpace = 'nowrap';
            }
        });

        // -- FINALIZE AND DOWNLOAD --
        let svgString = new XMLSerializer().serializeToString(svgNode);
        if (!svgString.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
            svgString = svgString.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
        }
        
        saveFileAs(svgString, 'circuit.svg', 'image/svg+xml', 'SVG Vector Graphic');
    }
	
    function importProject(e) { 
        const f = e.target.files[0]; 
        if(!f) return; 
        
        const r = new FileReader(); 
        r.onload = ev => {
            try {
                let parsedData = JSON.parse(ev.target.result);

                // =========================================================
                // BRANCH A: VIRTUOSO SCHEMATIC DETECTED
                // =========================================================
                if (parsedData.instances && parsedData.wires) {
                    
                    // Find all unique component categories in the file
                    const uniqueCells = new Set();
                    parsedData.instances.forEach(inst => {
                        if (VIRTUOSO_MAP[inst.cell]) uniqueCells.add(inst.cell);
                    });

                    // Build the checkboxes for the Swal Popup
                    let checkboxesHtml = '<div style="display:flex; flex-direction:column; gap:8px; text-align:left; background:#f4f6f7; padding:15px; border-radius:6px;">';
                    checkboxesHtml += `<label style="cursor:pointer; font-weight:bold;"><input type="checkbox" id="v-opt-pins" checked disabled> I/O Pins (Always Show Names)</label><hr style="margin:5px 0;">`;
                    
                    uniqueCells.forEach(cell => {
                        if (!['ipin', 'opin', 'iopin'].includes(cell)) {
                            checkboxesHtml += `<label style="cursor:pointer;"><input type="checkbox" class="v-val-toggle" value="${cell}" checked> Display values for <b>${cell}</b></label>`;
                        }
                    });
                    checkboxesHtml += '</div>';

                    Swal.fire({
                        title: 'Virtuoso Schematic Detected!',
                        html: `Select which components should display their parameter values on the canvas:<br><br>${checkboxesHtml}`,
                        showCancelButton: true,
                        confirmButtonText: 'Import to Canvas',
                        confirmButtonColor: '#16a085'
                    }).then((result) => {
                        if (result.isConfirmed) {
                            const allowedCells = new Set(['ipin', 'opin', 'iopin']);
                            document.querySelectorAll('.v-val-toggle').forEach(cb => {
                                if (cb.checked) allowedCells.add(cb.value);
                            });
                            // Route to the Virtuoso translation engine!
                            executeVirtuosoConversion(parsedData, allowedCells);
                        }
                    });
                    
                    return; // Stop here, the Virtuoso engine handles the rest!
                }

                // =========================================================
                // BRANCH B: NATIVE JOINTJS CIRCUIT DETECTED
                // =========================================================
                if (!parsedData || !Array.isArray(parsedData.cells)) {
                    throw new Error("Invalid project file format. The JSON must contain either Virtuoso 'instances' or JointJS 'cells'.");
                }

                // --- ΑΥΤΟΜΑΤΗ ΕΚΚΑΘΑΡΙΣΗ (PHANTOM DOT FIX) ---
                parsedData.cells = parsedData.cells.filter(cell => {
                    if (cell.type === 'standard.Link') {
                        let src = cell.source;
                        let tgt = cell.target;
                        let verts = cell.vertices || [];
                        if (src && tgt && src.x !== undefined && tgt.x !== undefined) {
                            if (src.x === tgt.x && src.y === tgt.y && verts.length === 0) {
                                console.log("🧹 Καθαρίστηκε phantom dot καλώδιο:", cell.id);
                                return false; 
                            }
                        }
                    }
                    return true; 
                });

                graph.fromJSON(parsedData); 
                syncVisibilityFromUI();
                
                // Force the text labels to draw on the canvas
                graph.getElements().forEach(el => {
                    if (el.get('latexMacro') && el.get('latexMacro') !== 'connectordot') {
                        updateElementLabel(el, el.get('displayedText'));
                    }
                });
                
                // Push all wires to the background layer AND normalize their thickness!
                graph.getLinks().forEach(link => {
                    link.toBack();
                    link.attr('line/strokeWidth', 1.8);
                    link.attr('line/vector-effect', 'non-scaling-stroke');
                    link.attr('line/targetMarker', null); 
                    link.attr('line/sourceMarker', null);
                });
                
                setTimeout(() => {
                    zoomFit(); 
                    clearSelection();
                    applyTheme(document.getElementById('theme-selector').value);
                
                    const savedLatex = graph.get('customLatex');
                    if (savedLatex) {
                        window.rawLatexCode = savedLatex;
                        const highlighted = savedLatex.split('\n').map(line => {
                            let match = line.match(/^(.*?)( % id:[a-zA-Z0-9-]+)$/);
                            if (match) {
                                return highlightLatex(escapeHTML(match[1])) + `<span class="sync-id" contenteditable="false">${match[2]}</span>`;
                            }
                            return highlightLatex(escapeHTML(line));
                        }).join('\n');
                        
                        document.getElementById('latex-output').innerHTML = highlighted;
                        latexEdited = true;
                    } else {
                        forceExportLatex();
                    }
                }, 150);

            } catch (err) {
                console.error("Import Error:", err);
                Swal.fire({
                    icon: 'error',
                    title: 'Import Failed',
                    text: err.message || "Failed to load the circuit file. It might be corrupted."
                });
            }
        }; 
        r.readAsText(f); 
        e.target.value = '';
    }

	function runLinterUI(onSuccessCallback = null) {
        let rawText = document.getElementById('latex-output').innerText;
        
        // ΚΑΘΑΡΙΣΜΟΣ ΤΩΝ IDs ΠΡΙΝ ΤΟΝ ΕΛΕΓΧΟ / COPY / DOWNLOAD!
        // Βρίσκει οτιδήποτε ξεκινάει με "% id:" και το εξαφανίζει.
        let cleanText = rawText.replace(/ % id:[a-zA-Z0-9-]+/g, '');
        
        const errors = validateLatexSyntax(cleanText);
        
        if (errors.length === 0) {
            if (onSuccessCallback) {
                onSuccessCallback(cleanText); // Στέλνει τον ΚΑΘΑΡΟ κώδικα!
            } else {
                Swal.fire({
                    icon: 'success',
                    title: 'LaTeX code OK!',
                    text: 'No errors found.',
                    timer: 1500,
                    showConfirmButton: false
                });
            }
        } else {
            // Αν βρέθηκαν λάθη, δείξε τη λίστα! (Το υπόλοιπο της συνάρτησης μένει ίδιο)
            const errorHtml = `<ul style="text-align: left; font-size: 14px; color: #c0392b; background: #fad390; padding: 15px; border-radius: 5px;">` + 
                              errors.map(e => `<li style="margin-bottom: 8px;">${e}</li>`).join('') + 
                              `</ul>`;
            
            Swal.fire({
                icon: 'error',
                title: 'Errors found',
                html: errorHtml,
                showCancelButton: onSuccessCallback ? true : false,
                confirmButtonText: onSuccessCallback ? "Ignore & Continue" : "OK, I'll fix them",
                cancelButtonText: 'Cancel',
                confirmButtonColor: '#e74c3c'
            }).then((result) => {
                if (result.isConfirmed && onSuccessCallback) {
                    onSuccessCallback(cleanText); // Και εδώ στέλνει τον καθαρό!
                }
            });
        }
    }

	// --- 9. LATEX LINTER (SYNTAX CHECKER) ---
    function validateLatexSyntax(rawText) {
        let errors = [];
        
        // --- THE FIX: Mask Math Blocks ---
        // We hide everything between $ $ so the linter doesn't get confused 
        // by KaTeX commands (like \frac) or extra brackets inside the math.
        let text = rawText.replace(/\$(.*?)\$/g, 'MATH_BLOCK');
        
        // 1. Check Overall Brace Balance { }
        let openBraces = (text.match(/\{/g) || []).length;
        let closeBraces = (text.match(/\}/g) || []).length;
        if (openBraces !== closeBraces) {
            errors.push(`<b>Brace Imbalance:</b> Found ${openBraces} open <code>{</code> and ${closeBraces} closed <code>}</code>.`);
        }
        
        // List of standard TikZ commands we allow
        const knownSystemMacros = ['begin', 'end', 'draw', 'tikzpictureJL', 'connectordot', 'setscale'];
        const macroRegex = /\\([a-zA-Z]+)/g;
        let match;
        
        // Scan the whole text for commands starting with \
        while ((match = macroRegex.exec(text)) !== null) {
            const macroName = match[1];
            const macroIndex = match.index;
            
            // 2. Check if command exists
            if (!knownSystemMacros.includes(macroName) && (!JL_DATABASE || !JL_DATABASE[macroName])) {
                errors.push(`<b>Unknown command:</b> <code>\\${macroName}</code>. Is there a typo?`);
                continue;
            }
            
            // 3. Argument Check (only for database components)
            if (JL_DATABASE && JL_DATABASE[macroName]) {
                const expectedArgs = JL_DATABASE[macroName].argsCount || 7;
                let argCount = 0;
                let i = macroIndex + match[0].length;
                
                // Scan linearly to correctly catch nested {} and []
                while (i < text.length) {
                    let char = text[i];
                    
                    // Ignore spaces between arguments
                    if (char === ' ' || char === '\n' || char === '\r' || char === '\t') { i++; continue; }
                    
                    if (char === '{' || char === '[') {
                        argCount++;
                        let openChar = char;
                        let closeChar = char === '{' ? '}' : ']';
                        let depth = 1;
                        i++;
                        // Move forward until the current argument closes (even if it has nested {})
                        while (i < text.length && depth > 0) {
                            if (text[i] === openChar) depth++;
                            else if (text[i] === closeChar) depth--;
                            i++;
                        }
                    } else {
                        // Found something else (e.g., normal text or new command), stop counting for this command
                        break;
                    }
                }
                
                if (argCount !== expectedArgs) {
                    errors.push(`<b>Argument Mismatch for <code>\\${macroName}</code>:</b><br>Found ${argCount} arguments, but the library requires exactly ${expectedArgs}.`);
                }
            }
        }
        
        return errors;
    }
	
	// --- NATIVE GEOMETRY PARSER ---
    function parseGeomArgs(data, argsArray) {
        let angle = 0;
        let flipH = false;
        let flipV = false;

        for (let i = 0; i < data.argsCount; i++) {
            let argDef = data.argNames[i] || { name: '' };
            let desc = argDef.name.toLowerCase();
            let customDef = data.argDefs ? data.argDefs.find(d => d.idx === i + 1) : null;
            let typeMatch = customDef ? customDef.type : '';
            let val = argsArray[i];

            if (!val) continue;

            if (typeMatch === 'rotflip' || (!customDef && desc.includes('rotation') && desc.includes('flip'))) {
                let parts = val.split(',');
                let tikzRot = parseFloat(parts[0]) || 0;
                angle = (360 - tikzRot) % 360;
                let f = parts[1] ? parts[1].trim() : '';
                if (f==='h') flipH = true; if (f==='v') flipV = true; if (f==='hv'||f==='vh') { flipH=true; flipV=true; }
            } else if (typeMatch === 'rotation' || (!customDef && (desc.includes('rotation') || desc.includes('angle')))) {
                let tikzRot = parseFloat(val) || 0;
                angle = (360 - tikzRot) % 360;
            } else if (typeMatch === 'flip' || (!customDef && desc.includes('flip'))) {
                let f = val.trim();
                if (f==='h') flipH = true; if (f==='v') flipV = true; if (f==='hv'||f==='vh') { flipH=true; flipV=true; }
            }
        }
        return { angle, flipH, flipV };
    }

                    </div>`;

        for (let i = 0; i < data.argsCount; i++) {
            let argDef = data.argNames[i] || { name: `Arg ${i+1}` };
            let desc = argDef.name.toLowerCase();
            let val = currentArgs[i] !== undefined ? currentArgs[i] : "";

            if (val === "" && (desc === 'name' || desc === 'text')) val = el.get('displayedText') || data.name;

            let isSystem = desc.includes('position') || desc.includes('grid') || desc.includes('show');
            if (isSystem) {
                htmlForm += `<input type="hidden" id="swal-input-${i}" value="${val}">`;
                continue;
            }

            let customDefs = data.argDefs ? data.argDefs.filter(d => d.idx === (i + 1)) : [];

            if (customDefs.length > 0) {
                // If there are multiple controls for this argument, split the saved comma-separated string!
                let valParts = customDefs.length > 1 ? val.split(',').map(s => s.trim()) : [val];

                customDefs.forEach((customDef, subIdx) => {
                    let activeVal = valParts[subIdx] !== undefined ? valParts[subIdx] : customDef.defVal;

	// --- 11. BI-DIRECTIONAL SYNC (LATEX TO CANVAS) ---

    // Έξυπνος Parser που διαβάζει τα ορίσματα {} και [] χωρίς να μπερδεύεται με φωλιασμένα άγκιστρα!
    function parseLatexArgs(argsStr) {
        let args = [], currentArg = '', depth = 0, inArg = false;
        for (let i = 0; i < argsStr.length; i++) {
            let char = argsStr[i];
            if (char === '{' || char === '[') {
                if (depth === 0) { inArg = true; currentArg = ''; } 
                else { currentArg += char; }
                depth++;
            } else if (char === '}' || char === ']') {
                depth--;
                if (depth === 0) { args.push(currentArg); inArg = false; } 
                else { currentArg += char; }
            } else {
                if (inArg) currentArg += char;
            }
        }
        return args;
    }
	
	function evaluatePinCondition(condStr, argsArray) {
        if (!condStr || condStr.trim() === '' || condStr === '1~=') return true;

        try {
            let parsedStr = condStr.replace(/(\d+)\s*(==|!=|~=)\s*([^&|()\s]*)/g, function(match, arg, op, val) {
                let argVal = (argsArray[parseInt(arg) - 1] || "").toString().trim();
                if (op === '==') return `("${argVal}" === "${val}")`;
                if (op === '!=') return `("${argVal}" !== "${val}")`;
                if (op === '~=') return `("${argVal}".includes("${val}"))`;
                return 'false';
            });
            return eval(parsedStr);
        } catch (e) {
            console.warn("Logic parsing error:", condStr);
            return false;
        }
    }

    function syncFromLatex() {
        const text = document.getElementById('latex-output').innerText;
        const lines = text.split('\n');

        lines.forEach(line => {
            // Ψάχνουμε γραμμές της μορφής: \macro{...} % id:xxxx
            let match = line.match(/\\([a-zA-Z0-9]+)(.*)% id:([a-zA-Z0-9-]+)/);
            if (match) {
                let macro = match[1].trim();
                let argsStr = match[2].trim();
                let cellId = match[3].trim();

                let cell = graph.getCell(cellId);
                let data = JL_DATABASE[macro];
                if (!cell || !data) return;

                let extractedArgs = parseLatexArgs(argsStr);
                if (extractedArgs.length !== data.argsCount) return;

                let customArgs = cell.get('customArgs') || [];
                
                // ΝΕΟ: Μεταβλητές για την Περιστροφή & Αναστροφή
                let applyGeom = false;
                let newAngle = cell.get('angle') || 0;
                let newFlipH = cell.get('flipH') || false;
                let newFlipV = cell.get('flipV') || false;

                // Ενημερώνουμε τις ιδιότητες (Αγνοούμε μόνο τη θέση (position) πλέον)
                for(let i=0; i<data.argsCount; i++) {
                    let desc = (data.argNames[i] || { name: '' }).name.toLowerCase();
                    
                    if (desc.includes('rotation') && desc.includes('flip')) {
                        let rotVal = extractedArgs[i].toLowerCase();
                        if (rotVal && !rotVal.includes('...')) {
                            let parts = rotVal.split(',');
                            let tikzRot = parseFloat(parts[0]) || 0;
                            newAngle = (360 - tikzRot) % 360;
                            
                            newFlipH = false; newFlipV = false;
                            if (parts.length > 1) {
                                let fStr = parts[1].trim();
                                if (fStr === 'hv' || fStr === 'vh') { newFlipH = true; newFlipV = true; }
                                else if (fStr === 'h') newFlipH = true;
                                else if (fStr === 'v') newFlipV = true;
                            }
                            applyGeom = true;
                        }
                    } 
                    else if (desc.includes('rotation') || desc.includes('angle')) {
                        let rotVal = extractedArgs[i].toLowerCase();
                        if (rotVal && !rotVal.includes('...')) {
                            let tikzRot = parseFloat(rotVal) || 0;
                            newAngle = (360 - tikzRot) % 360;
                            applyGeom = true;
                        }
                    }
                    else if (desc.includes('flip')) {
                        let fStr = extractedArgs[i].toLowerCase().trim();
                        if (fStr && !fStr.includes('...')) {
                            if (fStr === 'hv' || fStr === 'vh') { newFlipH = true; newFlipV = true; }
                            else if (fStr === 'h') { newFlipH = true; newFlipV = false; }
                            else if (fStr === 'v') { newFlipH = false; newFlipV = true; }
                            else if (fStr === 'none') { newFlipH = false; newFlipV = false; }
                            applyGeom = true;
                        }
                    }
                    else if (!desc.includes('position')) {
                        customArgs[i] = extractedArgs[i];
                        
                        if (desc === 'name' || desc === 'text') {
							let newName = extractedArgs[i] === '$NAME$' ? data.name : extractedArgs[i];
							updateElementLabel(cell, newName);
                        }
                    }
                }
                
                cell.set('customArgs', customArgs);
				// Assemble layers after syncing args
                assembleIcon(cell, customArgs);

                // --- ΝΕΟ: Εφαρμογή Rotation & Flip από τον κώδικα στον Καμβά ---
                if (applyGeom) {
                    // 1. Σώζουμε τη μαθηματική θέση του Pin (0,0)
                    let oldPin = getVisualOrigin(cell);
                    
                    // 2. Εφαρμόζουμε τις νέες ιδιότητες
                    cell.rotate(newAngle, true);
                    cell.set('flipH', newFlipH);
                    cell.set('flipV', newFlipV);
                    
                    // 3. Το applyRobustScale αναλαμβάνει να γυρίσει τα γραφικά, τα ports και τα labels!
                    applyRobustScale(cell, cell.get('customScale') || 1);
                    
                    // 4. Επαναφέρουμε το εξάρτημα ώστε το Pin (0,0) να μείνει ακλόνητο στο grid!
                    let newPin = getVisualOrigin(cell);
                    let p = cell.position();
                    cell.position(p.x + (oldPin.x - newPin.x), p.y + (oldPin.y - newPin.y));
                }
            }
        });

        // Αφού συγχρονίσαμε τον καμβά, ξαναχτίζουμε τον κώδικα για να τον "καθαρίσουμε" 
        // (και να εφαρμόσουμε τυχόν αλλαγές που έγιναν)
        latexEdited = false; 
        forceExportLatex(); 
        
		Swal.fire({
            toast: true,
            position: 'bottom-end',
            icon: 'success',
            title: 'Synced!',
            text: 'Canvas updated.',
            showConfirmButton: false,
            timer: 2000,
            timerProgressBar: true,
            background: '#f8f9fa',
            color: '#2c3e50'
        });
    }

	// --- CADENCE DISPLAY MODE (THEME SWITCHER) ---

    // Function to apply the selected theme to the entire canvas instantly
    function applyTheme(themeName) {
        const theme = THEME_COLORS[themeName];
        if (!theme) return;

        // --- 1. NEW: Safely turn off highlights BEFORE changing the rules ---
        selectedElements.forEach(el => { const v = paper.findViewByModel(el); if(v) v.unhighlight(); });
        selectedLinks.forEach(l => { const v = paper.findViewByModel(l); if(v) v.unhighlight(); });

        currentThemeName = themeName; // Update global state
        
        // Safely update the theme class without destroying JointJS system classes
        const paperEl = document.getElementById('my-paper');
        paperEl.classList.remove('theme-standard', 'theme-cadence');
        paperEl.classList.add('theme-' + themeName);

        // 1. Paper and Grid
        paper.drawBackground({ color: theme.background });
        updateDynamicGrid(); 

        // 2. Selection Rectangle (via CSS var)
        document.documentElement.style.setProperty('--selection-color', theme.selection);

        // 3. Highlight Style
        paper.options.highlighting['default'].options.attrs.stroke = theme.highlight;

        // 4. Default Link
        paper.options.defaultLink.attr('line/stroke', theme.wire);

        // 5. Update existing links
        graph.getLinks().forEach(link => {
            link.attr('line/stroke', theme.wire);
        });

// 6. Update existing elements
        graph.getElements().forEach(el => {
            const macro = el.get('latexMacro');
            if (macro === 'connectordot') {
                el.attr('dot/fill', theme.dot);
            } else {
                const dbData = JL_DATABASE[macro];
                const isFreeText = (macro === 'freetext');

                // Respect the hollow/solid rule
                el.attr('iconFill/fill', (dbData && dbData.filled) ? theme.componentIcon : 'none');
                
                // --- FIX 1: Keep the 'T' invisible for freetext! ---
                let customBaseStroke = (dbData && dbData.iconBaseStyle && dbData.iconBaseStyle.includes('stroke=')) 
                    ? dbData.iconBaseStyle.match(/stroke=([^,\]]+)/)[1].trim() 
                    : theme.componentIcon;

                el.attr('iconStroke/stroke', isFreeText ? 'transparent' : customBaseStroke); 
                
                // Apply the correct text color
                el.attr('label/fill', isFreeText ? theme.freeText : theme.componentLabel);
                
                // --- FIX 2: Force Math formulas to recalculate their new HTML color! ---
                if (el.get('displayedText') && el.get('displayedText').includes('$')) {
                    updateElementLabel(el); 
                }
                
                el.getPorts().forEach(port => {
                    el.portProp(port.id, 'attrs/portBody/fill', theme.portBody);
                    el.portProp(port.id, 'attrs/portLabel/fill', theme.portLabel);
                });

                // --- THE THEME FIX: Re-assemble the dynamic layers so they grab the new colors! ---
                assembleIcon(el, el.get('customArgs') || []);
            }
        });

        // --- 2. NEW: Turn the highlights back on with the NEW rules ---
        selectedElements.forEach(el => { const v = paper.findViewByModel(el); if(v) v.highlight(); });
        selectedLinks.forEach(l => { const v = paper.findViewByModel(l); if(v) v.highlight(); });
    }

	// --- NATIVE TEXT PARSER ΓΙΑ ΤΑ ΣΥΜΒΟΛΑ ---
    function extractStaticTexts(pathStr) {
        let texts = [];
        if (!pathStr) return { cleanPath: "", texts: [] };
        
        // 1. Extract the text data safely
        let cleanPath = pathStr.replace(/[Mm]\s+([-+]?[\d\.]+)\s+([-+]?[\d\.]+)\s*[Ll]\s*[-+]?[\d\.]+\s*[-+]?[\d\.]+\s*\/\*TEXT:([^,]+),([^,]+),(.*?)\*\//g, (match, x, y, size, style, str) => {
            texts.push({
                x: parseFloat(x), 
                y: parseFloat(y), 
                size: parseFloat(size), 
                style: style, 
                str: str
            });
            return ""; // Strip the node from the SVG
        }).trim();
        
        // 2. Aggressive Failsafe: Destroy ANY remaining TEXT tags and the MoveTo/LineTo that spawned them
        // This ensures the browser SVG parser never crashes on stray metadata!
        cleanPath = cleanPath.replace(/[Mm]\s*[-+]?[\d\.]+\s*[-+]?[\d\.]+\s*[Ll]\s*[-+]?[\d\.]+\s*[-+]?[\d\.]+\s*\/\*TEXT:.*?\*\//g, '').trim();
        cleanPath = cleanPath.replace(/\/\*TEXT:.*?\*\//g, '').trim();
        
        return { cleanPath, texts };
    }
	
	// --- DEFAULT ICON GENERATOR FOR PALETTE ---
    function getPaletteIconData(data) {
        let base = data.iconBase || data.icon || '';
        let layers = [];
        
        // --- FIX 1: Pull accurate defaults from argDefs (Matches Canvas logic) ---
        let defaultArgs = [];
        for (let i = 0; i < (data.argsCount || 7); i++) {
            let argDef = data.argNames && data.argNames[i] ? data.argNames[i].name : '';
            let defaultVal = '';
            
            // Fallback: Pick the first option if it's a slash-separated name
            if (argDef.includes('/')) {
                defaultVal = argDef.split('/')[0].trim();
            }

            // Override with the robust argDefs properties
            if (data.argDefs) {
                let customDefs = data.argDefs.filter(d => d.idx === (i + 1));
                if (customDefs.length > 1) {
                    defaultVal = customDefs.map(d => d.defVal || "").join(', ');
                } else if (customDefs.length === 1) {
                    defaultVal = customDefs[0].defVal || "";
                }
            }
            defaultArgs.push(defaultVal);
        }

        // Apply the smart preview overrides
        if (data.previewArgs) {
            Object.keys(data.previewArgs).forEach(idx => { defaultArgs[parseInt(idx) - 1] = data.previewArgs[idx]; });
        }

        if (data.variantArg && data.icons) {
            let defaultVariant = defaultArgs[data.variantArg - 1];
            base = data.icons[defaultVariant] ? data.icons[defaultVariant] : Object.values(data.icons)[0] || base;
        }
		
		// --- NEW: Evaluate JS Generator for Palette ---
        if (data.shapeGenerator) {
            try {
                const buildShape = new Function('args', data.shapeGenerator);
                // NEW: Pad the array so it is 1-indexed
                let jsArgs = ["", ...defaultArgs];
                const generated = buildShape(jsArgs);
                base = generated.pathStr; 
            } catch(e) { console.error("Palette Generation Error:", e); }
        }

        // --- FIX 2: Use the bulletproof evaluator we built earlier ---
        if (data.iconLayers) {
            data.iconLayers.forEach(layer => {
                if (evaluatePinCondition(layer.condition, defaultArgs)) {
                    layers.push({ ...layer });
                }
            });
        }
        return { base, layers };
    }

    document.getElementById('palette-search').addEventListener('input', function(e) {
        const term = e.target.value.toLowerCase().trim();
        const container = document.getElementById('items-container');

        let currentHeader = null;
        let visibleCountInCategory = 0;

        // Loop through everything in the palette (both headers and items)
        container.childNodes.forEach(node => {
            if (node.classList && node.classList.contains('category-header')) {
                // If we hit a new header, decide if the PREVIOUS header should be visible
                if (currentHeader) {
                    currentHeader.style.display = visibleCountInCategory > 0 ? 'block' : 'none';
                }
                currentHeader = node;
                visibleCountInCategory = 0; // Reset counter for the new category
            } 
            else if (node.classList && node.classList.contains('comp-item')) {
                const compName = node.getAttribute('data-search') || "";
                
                // Check if the component name includes the typed letters
                if (compName.includes(term)) {
                    node.style.display = 'flex';
                    visibleCountInCategory++;
                } else {
                    node.style.display = 'none';
                }
            }
        });

        // Don't forget to check the very last category in the list!
        if (currentHeader) {
            currentHeader.style.display = visibleCountInCategory > 0 ? 'block' : 'none';
        }
    });

	function syncRotFlip(inputId, source = 'rot') {
        const popup = Swal.getPopup();
        if (!popup) return;
        let rotInput = popup.querySelector(`#${inputId}-rot`);
        let flipSelect = popup.querySelector(`#${inputId}-flip`);
        let hidden = popup.querySelector(`#${inputId}`);
        if (!rotInput || !flipSelect || !hidden) return;
        
        let r = parseFloat(rotInput.value) || 0;
        let f = flipSelect.value;

        if (source === 'flip') {
            let oldVal = hidden.value || "0,none";
            let oldParts = oldVal.split(',');
            let oldF = oldParts[1] ? oldParts[1].trim() : 'none';

            let oldH = oldF === 'h' || oldF === 'hv' || oldF === 'vh';
            let oldV = oldF === 'v' || oldF === 'hv' || oldF === 'vh';
            let newH = f === 'h' || f === 'hv' || f === 'vh';
            let newV = f === 'v' || f === 'hv' || f === 'vh';

            if (oldH !== newH) r = (360 - r) % 360;
            if (oldV !== newV) r = (360 - r) % 360;

            rotInput.value = r; 
        }

        hidden.value = `${r},${f}`;
        hidden.dispatchEvent(new Event('change', { bubbles: true }));
    }

    function syncSeparateFlip(inputId, selectEl) {
        const popup = Swal.getPopup();
        if (!popup) return;
        let f = selectEl.value;
        let oldF = selectEl.getAttribute('data-old-val') || 'none';

        let oldH = oldF === 'h' || oldF === 'hv' || oldF === 'vh';
        let oldV = oldF === 'v' || oldF === 'hv' || oldF === 'vh';
        let newH = f === 'h' || f === 'hv' || f === 'vh';
        let newV = f === 'v' || f === 'hv' || f === 'vh';

        let rotInput = popup.querySelector('.rot-input-field');
        if (rotInput) {
            let r = parseFloat(rotInput.value) || 0;
            if (oldH !== newH) r = (360 - r) % 360;
            if (oldV !== newV) r = (360 - r) % 360;
            
            rotInput.value = r; 
            rotInput.dispatchEvent(new Event('input', { bubbles: true })); 
        }

        selectEl.setAttribute('data-old-val', f);
        selectEl.dispatchEvent(new Event('change', { bubbles: true }));
    }
