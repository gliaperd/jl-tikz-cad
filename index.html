	// --- 11. BI-DIRECTIONAL SYNC (LATEX TO CANVAS) ---

    // Έξυπνος Parser που διαβάζει τα ορίσματα {} και [] χωρίς να μπερδεύεται με φωλιασμένα άγκιστρα!
    function parseLatexArgs(argsStr) {
        let args = [], currentArg = '', depth = 0, inArg = false;
        for (let i = 0; i < argsStr.length; i++) {
            let char = argsStr[i];
            if (char === '{' || char === '[') {
                if (depth === 0) { inArg = true; currentArg = ''; } 
                else { currentArg += char; }
                depth++;
            } else if (char === '}' || char === ']') {
                depth--;
                if (depth === 0) { args.push(currentArg); inArg = false; } 
                else { currentArg += char; }
            } else {
                if (inArg) currentArg += char;
            }
        }
        return args;
    }

    function syncFromLatex() {
        const text = document.getElementById('latex-output').innerText;
        const lines = text.split('\n');

        lines.forEach(line => {
            // Ψάχνουμε γραμμές της μορφής: \macro{...} % id:xxxx
            let match = line.match(/\\([a-zA-Z0-9]+)(.*)% id:([a-zA-Z0-9-]+)/);
            if (match) {
                let macro = match[1].trim();
                let argsStr = match[2].trim();
                let cellId = match[3].trim();

                let cell = graph.getCell(cellId);
                let data = JL_DATABASE[macro];
                if (!cell || !data) return;

                let extractedArgs = parseLatexArgs(argsStr);
                if (extractedArgs.length !== data.argsCount) return;

                let customArgs = cell.get('customArgs') || [];
                let variantIndex = data.variantArg ? data.variantArg - 1 : -1;

                // Ενημερώνουμε τις ιδιότητες (Αγνοούμε τη θέση/περιστροφή για να μην "σπάσει" η δομή στον καμβά)
                for(let i=0; i<data.argsCount; i++) {
                    let desc = (data.argNames[i] || { name: '' }).name.toLowerCase();
                    if (!desc.includes('position') && !desc.includes('rotation')) {
                        customArgs[i] = extractedArgs[i];
                        
                        // Ενημέρωση του Ονόματος ή του Κειμένου στον Καμβά
                        if (desc === 'name' || desc === 'text') {
							let newName = extractedArgs[i] === '$NAME$' ? data.name : extractedArgs[i];
							updateElementLabel(cell, newName);
                        }
                    }
                }
                cell.set('customArgs', customArgs);
				// --- NEW: Assemble layers after syncing args! ---
					assembleIcon(cell, customArgs);
            }
        });

        // Αφού συγχρονίσαμε τον καμβά, ξαναχτίζουμε τον κώδικα για να τον "καθαρίσουμε" 
        // (και να εφαρμόσουμε τυχόν αλλαγές που έγιναν)
        latexEdited = false; 
        forceExportLatex(); 
        
		Swal.fire({
            toast: true,
            position: 'bottom-end',
            icon: 'success',
            title: 'Synced!',
            text: 'Canvas updated.',
            showConfirmButton: false,
            timer: 2000,
            timerProgressBar: true,
            background: '#f8f9fa',
            color: '#2c3e50'
        });
    }

	// --- CADENCE DISPLAY MODE (THEME SWITCHER) ---

    // Function to apply the selected theme to the entire canvas instantly
    function applyTheme(themeName) {
        const theme = THEME_COLORS[themeName];
        if (!theme) return;

        // --- 1. NEW: Safely turn off highlights BEFORE changing the rules ---
        selectedElements.forEach(el => { const v = paper.findViewByModel(el); if(v) v.unhighlight(); });
        selectedLinks.forEach(l => { const v = paper.findViewByModel(l); if(v) v.unhighlight(); });

        currentThemeName = themeName; // Update global state
        
        // Safely update the theme class without destroying JointJS system classes
        const paperEl = document.getElementById('my-paper');
        paperEl.classList.remove('theme-standard', 'theme-cadence');
        paperEl.classList.add('theme-' + themeName);

        // 1. Paper and Grid
        paper.drawBackground({ color: theme.background });
        updateDynamicGrid(); 

        // 2. Selection Rectangle (via CSS var)
        document.documentElement.style.setProperty('--selection-color', theme.selection);

        // 3. Highlight Style
        paper.options.highlighting['default'].options.attrs.stroke = theme.highlight;

        // 4. Default Link
        paper.options.defaultLink.attr('line/stroke', theme.wire);

        // 5. Update existing links
        graph.getLinks().forEach(link => {
            link.attr('line/stroke', theme.wire);
        });

// 6. Update existing elements
        graph.getElements().forEach(el => {
            const macro = el.get('latexMacro');
            if (macro === 'connectordot') {
                el.attr('dot/fill', theme.dot);
            } else {
                const dbData = JL_DATABASE[macro];
                const isFreeText = (macro === 'freetext');

                // Respect the hollow/solid rule
                el.attr('iconFill/fill', (dbData && dbData.filled) ? theme.componentIcon : 'none');
                
                // --- FIX 1: Keep the 'T' invisible for freetext! ---
                let customBaseStroke = (dbData && dbData.iconBaseStyle && dbData.iconBaseStyle.includes('stroke=')) 
                    ? dbData.iconBaseStyle.match(/stroke=([^,\]]+)/)[1].trim() 
                    : theme.componentIcon;

                el.attr('iconStroke/stroke', isFreeText ? 'transparent' : customBaseStroke); 
                
                // Apply the correct text color
                el.attr('label/fill', isFreeText ? theme.freeText : theme.componentLabel);
                
                // --- FIX 2: Force Math formulas to recalculate their new HTML color! ---
                if (el.get('displayedText') && el.get('displayedText').includes('$')) {
                    updateElementLabel(el); 
                }
                
                el.getPorts().forEach(port => {
                    el.portProp(port.id, 'attrs/portBody/fill', theme.portBody);
                    el.portProp(port.id, 'attrs/portLabel/fill', theme.portLabel);
                });

                // --- THE THEME FIX: Re-assemble the dynamic layers so they grab the new colors! ---
                assembleIcon(el, el.get('customArgs') || []);
            }
        });

        // --- 2. NEW: Turn the highlights back on with the NEW rules ---
        selectedElements.forEach(el => { const v = paper.findViewByModel(el); if(v) v.highlight(); });
        selectedLinks.forEach(l => { const v = paper.findViewByModel(l); if(v) v.highlight(); });
    }

    document.getElementById('theme-selector').addEventListener('change', (e) => {
        const selectedTheme = e.target.value;
        applyTheme(selectedTheme);
        
        // --- NEW: Save the user's preference to their browser ---
        localStorage.setItem('jlcad_theme_preference', selectedTheme);
    });

                document.getElementById('latex-output').innerHTML = "";
                userZoom = 1.0;
                paper.scale(userZoom / PPU_MULT, userZoom / PPU_MULT);
                paper.translate(0, 0); // Reset pan
                updateZoomDisplay();
                updateDynamicGrid();
                saveState(); // Add the cleared state to the Undo history!
            }
        });
    }
	
	// --- PANEL TOGGLE LOGIC ---
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const tab = document.getElementById('tab-sidebar');
        if (sidebar.classList.contains('collapsed')) {
            sidebar.classList.remove('collapsed');
            tab.style.display = 'none';
        } else {
            sidebar.classList.add('collapsed');
            tab.style.display = 'flex';
        }
        // Force the grid to update smoothly as the canvas expands
        setTimeout(() => { updateDynamicGrid(); }, 310);
    }

    function toggleOutput() {
        const output = document.getElementById('output-panel');
        const tab = document.getElementById('tab-output');
        if (output.classList.contains('collapsed')) {
            output.classList.remove('collapsed');
            tab.style.display = 'none';
        } else {
            output.classList.add('collapsed');
            tab.style.display = 'flex';
        }
        setTimeout(() => { updateDynamicGrid(); }, 310);
    }
	
	// --- DEFAULT ICON GENERATOR FOR PALETTE ---
    function getPaletteIconData(data) {
        let base = data.iconBase || data.icon || '';
        let layers = [];
        
        let defaultArgs = [];
        for (let i = 0; i < (data.argsCount || 7); i++) {
            let argDef = data.argNames && data.argNames[i] ? data.argNames[i].name : '';
            defaultArgs.push(argDef.includes('/') ? argDef.split('/')[0].trim() : '');
        }

        if (data.previewArgs) {
            Object.keys(data.previewArgs).forEach(idx => { defaultArgs[parseInt(idx) - 1] = data.previewArgs[idx]; });
        }

        if (data.variantArg && data.icons) {
            let defaultVariant = defaultArgs[data.variantArg - 1];
            base = data.icons[defaultVariant] ? data.icons[defaultVariant] : Object.values(data.icons)[0] || base;
        }

        if (data.iconLayers) {
            data.iconLayers.forEach(layer => {
                let conditions = layer.condition.split('&');
                let isMatch = true;
                conditions.forEach(cond => {
                    cond = cond.trim();
                    if (cond.includes('==')) {
                        let [argIdx, val] = cond.split('==');
                        if ((defaultArgs[parseInt(argIdx) - 1] || "").trim() !== val.trim()) isMatch = false;
                    } else if (cond.includes('~=')) {
                        let [argIdx, val] = cond.split('~=');
                        if (!(defaultArgs[parseInt(argIdx) - 1] || "").includes(val.trim())) isMatch = false;
                    }
                });
                if (isMatch) layers.push(layer);
            });
        }
        return { base, layers };
    }
	
	// --- SMART ICON ASSEMBLER (WITH DYNAMIC STYLING) ---
    function assembleIcon(el, argsArray) {
        let macro = el.get('latexMacro');
        let dbData = JL_DATABASE[macro];
        if (!dbData) return;
		
		let dynLabels = el.get('dynamicLabels') || [];

        let basePath = dbData.iconBase || dbData.icon || "";
        let dynamicMarkup = [
            { tagName: 'text', selector: 'label' },
            { tagName: 'foreignObject', selector: 'fo' },
            { tagName: 'rect', selector: 'body' },
            { tagName: 'g', selector: 'iconGroup', children: [
                { tagName: 'path', selector: 'iconFill' },
                { tagName: 'path', selector: 'iconStroke' }
            ]}
        ];

        let matchedLayers = [];
        if (dbData.variantArg && dbData.icons) {
            let val = argsArray[dbData.variantArg - 1];
            if (dbData.icons[val]) basePath = dbData.icons[val];
        }

        if (dbData.iconLayers) {
            dbData.iconLayers.forEach(layer => {
                let conditions = layer.condition.split('&');
                let isMatch = true;
                conditions.forEach(cond => {
                    cond = cond.trim();
                    if (cond.includes('==')) {
                        let [argIdx, val] = cond.split('==');
                        if ((argsArray[parseInt(argIdx) - 1] || "").trim() !== val.trim()) isMatch = false;
                    } else if (cond.includes('!=')) { // Υποστήριξη !=
                        let [argIdx, val] = cond.split('!=');
                        if ((argsArray[parseInt(argIdx) - 1] || "").trim() === val.trim()) isMatch = false;
                    } else if (cond.includes('~=')) {
                        let [argIdx, val] = cond.split('~=');
                        if (!(argsArray[parseInt(argIdx) - 1] || "").includes(val.trim())) isMatch = false;
                    }
                });
                if (isMatch) matchedLayers.push(layer);
            });
        }

        matchedLayers.forEach((layer, i) => {
            dynamicMarkup[3].children.push({ tagName: 'path', selector: `overlay_${i}` });
        });
		
		// Προσθήκη των Dynamic Labels στο Markup!
		dynLabels.forEach((lbl, i) => {
            dynamicMarkup.push({ tagName: 'text', selector: `dynLbl_${i}` });
        });

        // Εφαρμογή του νέου Markup
        el.set('markup', dynamicMarkup);

        // --- ΕΠΑΝΑΦΟΡΑ ΣΤΥΛ ΣΤΟ ΒΑΣΙΚΟ ΕΙΔΩΛΟ ---
        const theme = THEME_COLORS[currentThemeName] || THEME_COLORS.standard;
        el.attr('iconFill/d', basePath);
        el.attr('iconFill/fill', dbData.filled ? theme.componentIcon : 'none');
        
        el.attr('iconStroke/d', basePath);
        el.attr('iconStroke/stroke', (macro === 'freetext') ? 'transparent' : theme.componentIcon);
        el.attr('iconStroke/strokeWidth', 1.8); // Default πάχος

        // Αν υπάρχει ειδικό στυλ στο icon_base (π.χ. διαφορετικό πάχος)
        if (dbData.iconBaseStyle) {
            dbData.iconBaseStyle.split(',').forEach(s => {
                let p = s.split('=');
                if (p.length === 2) {
                    let k = p[0].trim(), v = p[1].trim();
                    if (k === 'stroke-width') el.attr('iconStroke/strokeWidth', parseFloat(v));
                    if (k === 'stroke') el.attr('iconStroke/stroke', v);
                }
            });
        }

        // Εφαρμογή στυλ στα Overlays
        matchedLayers.forEach((layer, i) => {
            let sel = `overlay_${i}`;
            el.attr(`${sel}/d`, layer.path);
            el.attr(`${sel}/fill`, 'none');
            el.attr(`${sel}/stroke`, theme.componentIcon);
            el.attr(`${sel}/strokeWidth`, 1.8);
            
            if (layer.style) {
                layer.style.split(',').forEach(s => {
                    let parts = s.split('=');
                    if (parts.length === 2) {
                        let k = parts[0].trim(), v = parts[1].trim();
                        if (k === 'stroke-width') el.attr(`${sel}/strokeWidth`, parseFloat(v));
                        else if (k === 'stroke') el.attr(`${sel}/stroke`, v);
                        else if (k === 'fill') el.attr(`${sel}/fill`, v === 'solid' ? theme.componentIcon : v);
                        else el.attr(`${sel}/${k}`, v);
                    }
                });
            }
        });
		
		let pinsHtml = '';

        // --- NATIVE DYNAMIC LABELS RENDERER (ΜΕ LATEX ΥΠΟΣΤΗΡΙΞΗ) ---
        dynLabels.forEach((lbl, i) => {
            let sel = `dynLbl_${i}`;
            let rawText = lbl.label || lbl.id;
            let newText = getDynamicPortLabel(rawText, argsArray);
            
            let isVisible = newText.trim() !== "";
            let shiftX = el.get('baseShiftX') !== undefined ? el.get('baseShiftX') : (el.get('shiftX') || 0);
            let shiftY = el.get('baseShiftY') !== undefined ? el.get('baseShiftY') : (el.get('shiftY') || 0);

            let finalX = lbl.x + shiftX;
            let finalY = lbl.y + shiftY;

            // Αν υπάρχει κείμενο ΚΑΙ περιέχει $, είναι Μαθηματικό!
            if (isVisible && newText.includes('$')) {
                
                let mathRendered = newText.replace(/\$(.*?)\$/g, (match, mathExpr) => {
                    try { 
						let boldExpr = `\\boldsymbol{${mathExpr}}`;
						return katex.renderToString(mathExpr, { throwOnError: false, displayMode: false }); 
					} 
                    catch(e) { return match; }
                });

                // Χτίζουμε το HTML του Pin
                // ΑΥΞΗΣΗ ΜΕΓΕΘΟΥΣ: Αλλάξαμε το 11 * 4 σε 13 * 4 (ή και 14 * 4 αν τα θες θηρία!)
                pinsHtml += `
                    <div style="position: absolute; left: ${finalX}px; top: ${finalY}px; transform: translate(-50%, -50%); white-space: nowrap; font-size: ${13 * 4}px; font-weight: bold; color: ${theme.componentLabel}; pointer-events: none;">
                        ${mathRendered}
                    </div>
                `;
                
                // Κρύβουμε εντελώς το SVG κείμενο για αυτό το pin
                el.attr(`${sel}/display`, 'none');
                
            } else {
                // Απλό Κανονικό SVG Text (αν πληκτρολόγησε π.χ. απλά "15V")
                el.attr(`${sel}/text`, newText);
                el.attr(`${sel}/x`, finalX);
                el.attr(`${sel}/y`, finalY);
                el.attr(`${sel}/fill`, theme.componentLabel); 
                el.attr(`${sel}/fontSize`, 11 * 4);   
                el.attr(`${sel}/fontWeight`, 'bold'); 
                el.attr(`${sel}/textAnchor`, 'middle'); 
                el.attr(`${sel}/display`, isVisible ? 'block' : 'none');
                el.attr(`${sel}/pointer-events`, 'none'); 
            }
        });

        // Αποθηκεύουμε τα HTML pins και καλούμε τον Μίκτη!
        el.set('mathHtmlPins', pinsHtml);
        if (typeof combineMathHtml === 'function') {
            combineMathHtml(el);
        }
    }
	
	// --- REAL-TIME PALETTE SEARCH ---
    document.getElementById('palette-search').addEventListener('input', function(e) {
        const term = e.target.value.toLowerCase().trim();
        const container = document.getElementById('items-container');

        let currentHeader = null;
        let visibleCountInCategory = 0;

        // Loop through everything in the palette (both headers and items)
        container.childNodes.forEach(node => {
            if (node.classList && node.classList.contains('category-header')) {
                // If we hit a new header, decide if the PREVIOUS header should be visible
                if (currentHeader) {
                    currentHeader.style.display = visibleCountInCategory > 0 ? 'block' : 'none';
                }
                currentHeader = node;
                visibleCountInCategory = 0; // Reset counter for the new category
            } 
            else if (node.classList && node.classList.contains('comp-item')) {
                const compName = node.getAttribute('data-search') || "";
                
                // Check if the component name includes the typed letters
                if (compName.includes(term)) {
                    node.style.display = 'flex';
                    visibleCountInCategory++;
                } else {
                    node.style.display = 'none';
                }
            }
        });

        // Don't forget to check the very last category in the list!
        if (currentHeader) {
            currentHeader.style.display = visibleCountInCategory > 0 ? 'block' : 'none';
        }
    });
	
</script>
