<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>JL TikZ CAD</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jointjs/3.7.0/joint.min.css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; background: #f0f2f5; overflow: hidden; }
        #toolbar { background: #2c3e50; color: white; padding: 10px; display: flex; gap: 8px; align-items: center; z-index: 2000; box-shadow: 0 2px 5px rgba(0,0,0,0.2); flex-wrap: wrap; }
        .tool-btn { background: #34495e; color: white; border: 1px solid #5d6d7e; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-size: 13px; transition: all 0.2s; }
        .tool-btn:hover { background: #4a6278; }
        .tool-btn.active { background: #3498db; border-color: #2980b9; }
        .v-separator { width: 1px; height: 20px; background: #5d6d7e; margin: 0 4px; }
        #main { display: flex; flex: 1; overflow: hidden; position: relative; }
        #sidebar { width: 220px; border-right: 1px solid #bdc3c7; overflow-y: auto; padding: 15px; background: #fff; z-index: 10; flex-shrink: 0; }
        
        #paper-container { flex: 1; background: #cbd5e0; overflow: hidden; position: relative; outline: none; cursor: grab; }
        #paper-container:active { cursor: grabbing; }
        #my-paper { width: 100%; height: 100%; background: white; }
        
        #draw-glasspane { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1500; cursor: crosshair; display: none; background: rgba(255,255,255,0.01); }
		
		#output-panel { 
            height: 160px; 
            background: #1e1e1e; 
            border-top: 3px solid #3498db; 
            display: flex; 
            flex-direction: column; 
            padding: 10px;
            resize: vertical; 
            overflow: hidden; /* Αλλάζουμε το auto σε hidden εδώ */
            min-height: 100px; 
            max-height: 80vh;
            position: relative; /* ΠΡΟΣΘΗΚΗ */
        }
        
        /* ΝΕΑ ΚΛΑΣΗ ΓΙΑ ΤΑ ΚΟΥΜΠΙΑ */
        .floating-buttons {
            position: absolute;
            top: 10px;
            right: 35px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        #latex-output { 
            color: #d4d4d4; 
            font-family: 'Consolas', monospace; 
            font-size: 13px; 
            white-space: pre; 
            flex: 1; 
            overflow-y: auto; /* κάνει scroll ΜΟΝΟ το κείμενο */
            padding-top: 30px; /* Χώρος για να μην κρύβεται το κείμενο */
        }

        /* Προαιρετικά: Μια όμορφη λαβή για το resize */
        #output-panel::-webkit-resizer {
            background-color: #3498db;
            border: 3px solid #1e1e1e;
            outline: 1px solid #3498db;
        }
		
		#latex-output:focus {
			outline: none;
			background: #1a252f; /* Λίγο πιο σκούρο για να δείχνει ότι είναι active */
			box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
		}
		
        .highlight { background: rgba(52, 152, 219, 0.4); border-left: 3px solid #3498db; margin-left: -3px; border-radius: 2px; }
        .joint-selection-rect { border: 2px dashed #3498db; background: rgba(52, 152, 219, 0.2); position: absolute; pointer-events: none; z-index: 3000; }
		
		/* Νέο στυλ για την επιλογή εξαρτημάτων */
        .joint-highlighted[magnitude="0"] rect {
            stroke: #3498db !important;
            stroke-width: 1px !important;
            stroke-dasharray: 5,5 !important; /* Διακεκομμένη γραμμή */
            fill: rgba(52, 152, 219, 0.05) !important;
        }
		
		/* Ενοποιημένο comp-item */
		.comp-item { 
			padding: 8px; 
			margin-bottom: 6px; 
			background: #ecf0f1; 
			cursor: pointer; 
			border-radius: 6px; 
			font-size: 12px;
			border-left: 4px solid #3498db; 
			display: flex; 
			align-items: center; 
			min-height: 44px; 
			overflow: hidden; 
			transition: all 0.2s ease;
		}	
		.comp-item:hover {
			background: #dff9fb; 
			border-left: 4px solid #2980b9;
			transform: translateX(5px);
		}
		
		/* Syntax Highlighting για το LaTeX */
        .tex-cmd { color: #c678dd; font-weight: bold; }      /* Μοβ για τις εντολές */
        .tex-brace { color: #56b6c2; }                       /* Γαλάζιο για τις αγκύλες */
        .tex-place { color: #e06c75; font-style: italic; }   /* Απαλό κόκκινο */
				
		/* Εξασφαλίζει ότι τα popup μηνύματα εμφανίζονται πάνω από το Wire Layer */
        .swal2-container {
            z-index: 10000 !important;
        }
		#my-paper { 
            width: 100%; height: 100%; 
            background-color: #ffffff !important; 
            background-image: 
                radial-gradient(circle at 0px 0px, #bdc3c7 1.5px, transparent 1.5px),
                radial-gradient(circle at 0px 0px, #2c3e50 2.5px, transparent 2.5px);
            background-repeat: repeat;
        }
    </style>
</head>
<body>

<div id="toolbar">
    <button id="tool-pan" class="tool-btn active">🖐️ Select</button>
    <button id="tool-draw" class="tool-btn">✏️ Wire</button>
    <div class="v-separator"></div>
    
    <button onclick="copySelected()" class="tool-btn" style="color:#f39c12">📋 Copy</button>
    <button onclick="pasteCopied()" class="tool-btn" style="color:#f1c40f">📝 Paste</button>
	<button onclick="deleteSelected()" class="tool-btn" style="color:#ff7675">✖ Delete</button>
    <button onclick="rotateSelected()" class="tool-btn">↻ Rotate</button>
    <button onclick="flipHorizontal()" class="tool-btn">↔ Flip H</button>
    <button onclick="flipVertical()" class="tool-btn">↕ Flip V</button>
	<label style="color:white; font-size:12px; display:flex; align-items:center; gap:5px; cursor:pointer; user-select:none;">
		<input type="checkbox" id="toggle-pin-names" checked> Show Pin Names
	</label>
    
    <div class="v-separator"></div>
    <button onclick="zoomFit()" class="tool-btn" style="background:#2980b9; font-weight:bold;">🎯 Fit</button>
    <span id="zoom-level" style="font-size: 11px; min-width: 40px; text-align:center;">100%</span>
    
    <div class="v-separator"></div>
    <button onclick="saveProject()" class="tool-btn" style="background:#8e44ad">💾 Save JSON</button>
    <button onclick="document.getElementById('importFile').click()" class="tool-btn" style="background:#d35400">📂 Load JSON</button>
    <input type="file" id="importFile" style="display:none" onchange="importProject(event)" accept=".json">
    
    <div style="margin-left:auto; display:flex; gap:8px;">
        <button onclick="downloadLatex(false)" style="background: #27ae60; color:white;" class="tool-btn">📄 Export TikZ (.tex)</button>
        <button onclick="downloadLatex(true)" style="background: #16a085; color:white;" class="tool-btn">📦 Export Standalone LaTeX</button>
    </div>
</div>

<div id="main">
    <div id="paper-container" tabindex="0">
        <div id="draw-glasspane"></div>
        <div id="my-paper"></div>
    </div>
    <div id="sidebar">
        <strong style="display:block; margin-bottom:15px; color:#2c3e50;">ΕΞΑΡΤΗΜΑΤΑ</strong>
        <div id="items-container"></div>
    </div>
</div>

<div id="output-panel">
    <div class="floating-buttons">
		<button onclick="syncFromLatex()" class="tool-btn" style="background: #8e44ad; font-size: 11px;">🔄 Sync to Canvas</button>
        <button onclick="runLinterUI()" class="tool-btn" style="background: #e67e22; font-size: 11px;">🔍 Check Syntax</button>
        <button onclick="copyLatexToClipboard()" class="tool-btn" style="background: #34495e; font-size: 11px;">📋 Copy TikZ Code</button>
    </div>
    <div id="latex-output" contenteditable="true" spellcheck="false"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/backbone.js/1.4.1/backbone-min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jointjs/3.7.0/joint.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="components_db.js"></script>

<script>
    // --- ΟΡΙΣΜΟΣ CUSTOM CONNECTORDOT ---
    window.joint.shapes.jl = {}; 
    joint.shapes.jl.ConnectorDot = joint.dia.Element.define('jl.ConnectorDot', {
        size: { width: 20, height: 20 },
        attrs: {
            hitbox: { width: 20, height: 20, fill: '#ffffff', 'fill-opacity': 0, stroke: 'none', 'pointer-events': 'all' },
            dot: { cx: 10, cy: 10, r: 3.5, fill: '#000000', stroke: 'none', 'pointer-events': 'none' }
        }
    }, {
        markup: [{ tagName: 'rect', selector: 'hitbox' }, { tagName: 'circle', selector: 'dot' }]
    });
	
	// --- ΕΞΥΠΝΟ ΕΞΑΡΤΗΜΑ (Διορθωμένο Z-Index & Hitbox) ---
		joint.shapes.jl.Component = joint.dia.Element.define('jl.Component', {
			size: { width: 40, height: 40 },
			attrs: {
				// Το body παραμένει στη βάση για να πιάνει το κλικ
				body: { 
					refWidth: '100%', refHeight: '100%', 
					fill: '#ffffff', fillOpacity: 0.01, stroke: 'none', 
					'pointer-events': 'all', cursor: 'pointer' 
				},
				// Το foreignObject (fo) ξεκινάει ως 1x1 "κουκκίδα" για να μην καλύπτει τίποτα
				fo: { display: 'none', width: 1, height: 1, 'pointer-events': 'none' }
			}
		}, {
			markup: [
				{ tagName: 'text', selector: 'label' },           // 1ο: Το απλό κείμενο (πίσω)
				{ tagName: 'foreignObject', selector: 'fo' },    // 2ο: Τα μαθηματικά (πίσω)
				{ tagName: 'rect', selector: 'body' },            // 3ο: Το σώμα επιλογής
				{ tagName: 'path', selector: 'icon' }             // 4ο: Το σύμβολο (πάνω)
			]
		});

	// Το View που φτιάχνει ένα ΠΡΑΓΜΑΤΙΚΟ HTML div (ώστε ο browser να το κάνει render)
		joint.shapes.jl.ComponentView = joint.dia.ElementView.extend({
			initialize: function() {
				joint.dia.ElementView.prototype.initialize.apply(this, arguments);
				this.listenTo(this.model, 'change:mathHtml', this.updateHTML);
				
				// Το Μυστικό: Φτιάχνουμε το div με το επίσημο HTML Namespace!
				this.htmlContainer = document.createElementNS('http://www.w3.org/1999/xhtml', 'div');
				this.htmlContainer.style.width = '100%';
				this.htmlContainer.style.height = '100%';
				this.htmlContainer.style.display = 'flex';
				this.htmlContainer.style.justifyContent = 'center';
				this.htmlContainer.style.alignItems = 'center';
				this.htmlContainer.style.pointerEvents = 'none';
			},
			render: function() {
				joint.dia.ElementView.prototype.render.apply(this, arguments);
				
				const fo = this.el.querySelector('foreignObject');
				if (fo && !fo.contains(this.htmlContainer)) {
					fo.appendChild(this.htmlContainer);
				}
				
				this.updateHTML();
				return this;
			},
			updateHTML: function() {
				let htmlStr = this.model.get('mathHtml');
				if (htmlStr !== undefined) {
					this.htmlContainer.innerHTML = htmlStr;
				}
			}
		});


	const graph = new joint.dia.Graph();

    let currentScale = 1;
    const container = document.getElementById('paper-container');
    window.rawLatexCode = "";

    // --- 2. ΚΛΙΜΑΚΕΣ ΚΑΙ ΜΑΓΝΗΤΗΣ (ΑΠΟΛΥΤΗ ΤΑΥΤΙΣΗ) ---
    const PPU_MULT = 4; 
    const EXPORT_DIV = PPU_MULT * 10; 
      
    function updateElementLabel(el, newText) {
        if (newText !== undefined) el.set('displayedText', newText);
        let text = el.get('displayedText') || "";
        
        let isFreeText = el.get('latexMacro') === 'freetext';
        let scale = el.get('customScale') || 1;
        let isEmpty = text.trim() === "";
        let displayText = text;
        if (isEmpty && isFreeText) displayText = "[ Κενό ]"; 

        if (isFreeText) { el.resize(80 * scale, 40 * scale); }

        let isMath = displayText.includes('$');
        let fontSize = isFreeText ? Math.round(14 * PPU_MULT * scale) : 11 * PPU_MULT; 
        
        let centerX = el.size().width / 2;
        let centerY = isFreeText ? el.size().height / 2 : el.size().height + (12 * PPU_MULT);

        if (isMath) {
            el.attr('label/display', 'none'); 
            
            let mathRendered = displayText.replace(/\$(.*?)\$/g, (match, mathExpr) => {
                try { return katex.renderToString(mathExpr, { throwOnError: false, displayMode: false }); } 
                catch(e) { return match; }
            });
            
            el.attr('fo/display', 'block');
            el.attr('fo/x', centerX);
            el.attr('fo/y', centerY);
            el.attr('fo/style', 'overflow: visible; pointer-events: none;');
            
            let htmlStr = `<div style="position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-size: ${fontSize}px; color: #2c3e50; opacity: ${isEmpty ? 0.3 : 1}; pointer-events: none;">${mathRendered}</div>`;
            el.set('mathHtml', htmlStr);
        } else {
            el.attr('fo/display', 'none'); 
            el.attr('label/display', 'block'); 
            el.attr('label/text', displayText);
            el.attr('label/refX', '50%');
            el.attr('label/refY', isFreeText ? '50%' : '100%');
            el.attr('label/refY2', isFreeText ? 0 : 10 * PPU_MULT);
            el.attr('label/fontSize', fontSize);
            el.attr('label/opacity', isEmpty ? 0.3 : 1);
            el.set('mathHtml', ''); 
        }
    }

	const paper = new joint.dia.Paper({
        el: document.getElementById('my-paper'),
        model: graph,
        width: '100%', height: '100%', 
        gridSize: 10, 
        background: { color: 'transparent' }, // Αφήνουμε το λευκό του CSS να φανεί
        // ΤΕΛΟΣ ΤΟ drawGrid! Το κάνει το CSS.
        
        snapLinks: { radius: 15 },
        linkPinning: false,
        defaultLink: new joint.shapes.standard.Link({
            attrs: { line: { stroke: '#333', strokeWidth: 1.5 * PPU_MULT, targetMarker: null } }
        }),
        useModelGeometry: true,
        cellViewNamespace: joint.shapes,
        highlighting: {
            'default': {
                name: 'stroke',
                options: { padding: 3, rx: 5, ry: 5, attrs: { 'stroke-width': 3, stroke: '#f39c12' } }
            }
        }
    });

// --- ΤΟ ΑΠΟΛΥΤΟ TRICK: CSS Grid που ακολουθεί την κάμερα ΚΑΙ το Zoom! ---
    function updateDynamicGrid() {
        let t = paper.translate();
        let s = paper.scale().sx;
        
        // 1. Υπολογισμός Αποστάσεων (Κενά ανάμεσα στις τελείες)
        let minorSize = 20 * PPU_MULT * s; 
        let majorSize = 80 * PPU_MULT * s; 
        
        // 2. Πάχος Τελείας: Αυξήσαμε τους συντελεστές (3 και 5) για να "ακούνε" σωστά στο μεγάλο zoom
        let minorDot = Math.max(1.5, 3 * s); 
        let majorDot = Math.max(2.5, 5 * s);
        
        // 3. Εφαρμογή με Anti-Aliasing (+0.5px στο transparent) για πιο "γεμάτες" κουκκίδες
        $('#my-paper').css({
            'background-image': `
                radial-gradient(circle at 0px 0px, #bdc3c7 ${minorDot}px, transparent ${minorDot + 0.5}px),
                radial-gradient(circle at 0px 0px, #7f8c8d ${majorDot}px, transparent ${majorDot + 0.5}px)
            `,
            'background-size': `${minorSize}px ${minorSize}px, ${majorSize}px ${majorSize}px`,
            'background-position': `${t.tx}px ${t.ty}px, ${t.tx}px ${t.ty}px`
        });
    }

    // Καλούμε τη συνάρτηση ΚΑΘΕ φορά που κάνουμε Pan ή Zoom!
    paper.on('translate scale', updateDynamicGrid);

	
	
	// --- NATIVE CAD FAKE SCALING (PPU = 40) ---
		// Μεγεθύνουμε αυτόματα όλα τα Pins της βάσης κατά τη φόρτωση
		if (typeof JL_DATABASE !== 'undefined') {
			Object.keys(JL_DATABASE).forEach(k => {
				if (JL_DATABASE[k].pins && !JL_DATABASE[k].scaled) {
					JL_DATABASE[k].pins.forEach(p => { p.x *= PPU_MULT; p.y *= PPU_MULT; });
					JL_DATABASE[k].scaled = true; // Flag για να μην το ξανατρέξουμε 
				}
			});
		}
	
	let latexEdited = false;
    let suppressWarning = false;
    let isSwalOpen = false;

    // Ανιχνεύουμε αν ο χρήστης γράφει με το χέρι μέσα στο LaTeX Box
    $(document).on('input', '#latex-output', function() {
        latexEdited = true;
    });

    window.onload = () => {
        container.scrollLeft = 2500 - (container.clientWidth / 2);
        container.scrollTop = 2500 - (container.clientHeight / 2);
    };
    container.focus();
	
	// --- DRAG & DROP DROPZONE ---
		container.addEventListener('dragover', (e) => {
			e.preventDefault(); // Απαραίτητο για να επιτραπεί το drop
			e.dataTransfer.dropEffect = 'copy';
		});

		container.addEventListener('drop', (e) => {
			e.preventDefault();
			const type = e.dataTransfer.getData('application/jl-component');
			if (type) {
				// Καλούμε την addComponent περνώντας τις συντεταγμένες του ποντικιού!
				addComponent(type, e.clientX, e.clientY);
			}
		});

   // --- 1. ZOOM & FIT (ΜΕ FAKE SCALING) ---
    let userZoom = 1.0; // Το Zoom που βλέπει ο χρήστης (1 = 100%)
    
    // Αρχικοποιούμε τον καμβά στο 1/4! 
    paper.scale(1 / PPU_MULT, 1 / PPU_MULT);
	updateDynamicGrid();

    function updateZoomDisplay() { 
        document.getElementById('zoom-level').innerText = Math.round(userZoom * 100) + '%'; 
    }

function zoomFit() {
        const bbox = graph.getCellsBBox();
        
        if (!bbox || bbox.width === 0 || bbox.height === 0) {
            // Αν ο καμβάς είναι άδειος, μηδενίζουμε τα πάντα
            paper.translate(0, 0);
            userZoom = 1.0;
            paper.scale(userZoom / PPU_MULT, userZoom / PPU_MULT);
            updateZoomDisplay();
            updateDynamicGrid(); // Ενημέρωση πλέγματος
            return;
        }

        // 1. Χρησιμοποιούμε τη native μέθοδο για να υπολογίσει η JointJS τη νέα κλίμακα και θέση
        paper.scaleContentToFit({
            padding: 50,
            minScale: 0.1 / PPU_MULT,
            maxScale: 1.5 / PPU_MULT,
            useModelGeometry: true
        });

        // 2. Ενημερώνουμε το "ψεύτικο" zoom που βλέπει ο χρήστης βάσει της νέας κλίμακας
        userZoom = paper.scale().sx * PPU_MULT;
        
        // 3. ΔΙΟΡΘΩΣΗ: Αν το zoomFit μας έφερε σε πολύ περίεργα δεκαδικά, 
        // στρογγυλοποιούμε ελαφρώς για να μην "τρεμοπαίζει" το grid
        userZoom = Math.round(userZoom * 100) / 100;
        
        updateZoomDisplay();

        // 4. ΤΟ ΚΛΕΙΔΙ: Καλούμε τη συνάρτηση που συγχρονίζει το CSS Grid με τη νέα θέση
        // Χωρίς αυτό, τα εξαρτήματα θα φαίνονται "εκτός πλέγματος"
        updateDynamicGrid();
    }

	$(container).on('mousewheel DOMMouseScroll', function(e) {
        if (e.ctrlKey) {
            e.preventDefault();
            const delta = Math.max(-1, Math.min(1, (e.originalEvent.wheelDelta || -e.originalEvent.detail)));
            
            if (delta > 0) userZoom = Math.min(userZoom + 0.1, 3);
            else userZoom = Math.max(userZoom - 0.1, 0.2);
            
            // Το πιο ασφαλές Zoom (χωρίς origin) για να μην χάνονται τα εξαρτήματα
            let safeScale = userZoom / PPU_MULT;
            paper.scale(safeScale, safeScale);
            updateZoomDisplay();
        }
    });

    // --- 2. ΕΠΙΛΟΓΗ ΚΑΙ PANNING ---
    let selectionRect = null, selectionStart = null, selectedElements = [], selectedLinks = [];
    let dragPanStart = null, groupDragData = null;

    function clearSelection() {
        selectedElements.forEach(el => { const v = paper.findViewByModel(el); if(v) v.unhighlight(); });
        selectedLinks.forEach(l => { const v = paper.findViewByModel(l); if(v) v.unhighlight(); });
        selectedElements = []; selectedLinks = [];
        exportLatex();
    }

    paper.on('blank:pointerdown', function(evt, x, y) {
        if (evt.button === 1 || (evt.button === 0 && evt.altKey)) {
            const translate = paper.translate();
            dragPanStart = { x: evt.clientX, y: evt.clientY, tx: translate.tx, ty: translate.ty };
        } else if (evt.button === 0) {
            clearSelection();
            selectionStart = { x: evt.clientX, y: evt.clientY };
            selectionRect = $('<div class="joint-selection-rect">').appendTo('body');
            container.focus();
        }
    });

    $(document).on('mousemove', function(evt) {
			if (dragPanStart) {
            paper.translate(
                dragPanStart.tx + (evt.clientX - dragPanStart.x), 
                dragPanStart.ty + (evt.clientY - dragPanStart.y)
            );
            updateDynamicGrid(); 
        }
        if (selectionStart && selectionRect) {
            const left = Math.min(selectionStart.x, evt.clientX), top = Math.min(selectionStart.y, evt.clientY);
            const width = Math.abs(selectionStart.x - evt.clientX), height = Math.abs(selectionStart.y - evt.clientY);
            selectionRect.css({ left, top, width, height });
        }
    });

    $(document).on('mouseup', function(evt) {
        dragPanStart = null;
        if (selectionStart && selectionRect) {
            const p1 = paper.clientToLocalPoint({ x: selectionStart.x, y: selectionStart.y });
            const p2 = paper.clientToLocalPoint({ x: evt.clientX, y: evt.clientY });
            const selRect = new g.rect(Math.min(p1.x, p2.x), Math.min(p1.y, p2.y), Math.max(1, Math.abs(p1.x - p2.x)), Math.max(1, Math.abs(p1.y - p2.y)));

            graph.getElements().forEach(el => { if (selRect.intersect(el.getBBox().inflate(2))) { selectedElements.push(el); const v = paper.findViewByModel(el); if(v) v.highlight(); } });
            graph.getLinks().forEach(link => { if (selRect.intersect(link.getBBox().inflate(2))) { selectedLinks.push(link); const v = paper.findViewByModel(link); if(v) v.highlight(); } });

            selectionRect.remove(); selectionRect = null; selectionStart = null;
            exportLatex(); 
        }
    });

    // --- 3. GROUP MOVE ---
    paper.on('cell:pointerdown', function(cellView) {
        container.focus();
        let model = cellView.model;
        if (!selectedElements.includes(model) && !selectedLinks.includes(model)) {
            clearSelection();
            if (model.isLink()) selectedLinks.push(model); else selectedElements.push(model);
            cellView.highlight();
            exportLatex(); 
        }
        
        groupDragData = { originCell: model, startPos: model.isLink() ? null : model.position(), initials: new Map() };
        [...selectedElements, ...selectedLinks].forEach(c => {
            if (c.isLink()) groupDragData.initials.set(c.id, { source: _.cloneDeep(c.source()), target: _.cloneDeep(c.target()), vertices: _.cloneDeep(c.vertices() || []) });
            else groupDragData.initials.set(c.id, _.cloneDeep(c.position()));
        });
    });

    graph.on('change:position', function(cell, newPos, opt) {
        if (opt.groupMove || !groupDragData || groupDragData.originCell !== cell || !groupDragData.startPos) return;
        const dx = newPos.x - groupDragData.startPos.x, dy = newPos.y - groupDragData.startPos.y;

        selectedElements.forEach(other => {
            if (other === cell) return;
            const init = groupDragData.initials.get(other.id);
            if (init) other.position(init.x + dx, init.y + dy, { groupMove: true });
        });

        selectedLinks.forEach(other => {
            const init = groupDragData.initials.get(other.id);
            if (init) {
                const s = init.source, t = init.target;
                if (!s.id) other.source({ x: s.x + dx, y: s.y + dy }, { groupMove: true });
                if (!t.id) other.target({ x: t.x + dx, y: t.y + dy }, { groupMove: true });
                if (init.vertices.length) other.vertices(init.vertices.map(v => ({ x: v.x + dx, y: v.y + dy })));
            }
        });
        exportLatex();
    });

    graph.on('change:source change:target change:vertices', function(cell, newVal, opt) {
        if (opt.groupMove || !groupDragData || groupDragData.originCell !== cell) return;
        const init = groupDragData.initials.get(cell.id);
        if (!init) return;

        let dx = 0, dy = 0;
        const s = cell.source(), t = cell.target();
        if (s && s.x !== undefined && init.source && init.source.x !== undefined) { dx = s.x - init.source.x; dy = s.y - init.source.y; } 
        else if (t && t.x !== undefined && init.target && init.target.x !== undefined) { dx = t.x - init.target.x; dy = t.y - init.target.y; }

        if (dx === 0 && dy === 0) return;

        selectedElements.forEach(other => {
            const otherInit = groupDragData.initials.get(other.id);
            if (otherInit) other.position(otherInit.x + dx, otherInit.y + dy, { groupMove: true });
        });

        selectedLinks.forEach(other => {
            if (other === cell) return;
            const otherInit = groupDragData.initials.get(other.id);
            if (otherInit) {
                const os = otherInit.source, ot = otherInit.target;
                if (!os.id) other.source({ x: os.x + dx, y: os.y + dy }, { groupMove: true });
                if (!ot.id) other.target({ x: ot.x + dx, y: ot.y + dy }, { groupMove: true });
                if (otherInit.vertices && otherInit.vertices.length) other.vertices(otherInit.vertices.map(v => ({ x: v.x + dx, y: v.y + dy })));
            }
        });
        exportLatex();
    });

    paper.on('cell:pointerup', () => { groupDragData = null; });

    // --- 4. COPY / PASTE / ROTATE / FLIP ---
    let clipboard = [];
    function copySelected() { if (selectedElements.length > 0 || selectedLinks.length > 0) clipboard = [...selectedElements, ...selectedLinks].map(cell => cell.toJSON()); }

    function pasteCopied() {
        if (!clipboard || clipboard.length === 0) return;
        const idMap = {}, newCellsData = [];

        clipboard.forEach(cellData => {
            const newId = 'cell-' + Math.random().toString(36).substr(2, 9);
            idMap[cellData.id] = newId;
            const newData = JSON.parse(JSON.stringify(cellData));
            newData.id = newId;
            if (newData.position) { newData.position.x += 20; newData.position.y += 20; }
            if (newData.vertices) { newData.vertices = newData.vertices.map(v => ({ x: v.x + 20, y: v.y + 20 })); }
            newCellsData.push(newData);
        });

        newCellsData.forEach(data => {
            if (data.type === 'standard.Link') {
                if (data.source && data.source.id && idMap[data.source.id]) data.source.id = idMap[data.source.id];
                else if (data.source && data.source.x !== undefined) { data.source.x += 20; data.source.y += 20; }
                if (data.target && data.target.id && idMap[data.target.id]) data.target.id = idMap[data.target.id];
                else if (data.target && data.target.x !== undefined) { data.target.x += 20; data.target.y += 20; }
            }
        });

		const models = newCellsData.map(data => {
            if (data.type === 'standard.Link') return new joint.shapes.standard.Link(data);
            if (data.type === 'jl.ConnectorDot') return new joint.shapes.jl.ConnectorDot(data);
            if (data.type === 'jl.Component') return new joint.shapes.jl.Component(data); // <--- ΠΡΟΣΘΗΚΗ
            return new joint.shapes.standard.Rectangle(data);
        });

        graph.addCells(models);
        clearSelection();
        models.forEach(m => {
            if (m.isLink()) selectedLinks.push(m); else selectedElements.push(m);
            setTimeout(() => { const v = paper.findViewByModel(m); if (v) v.highlight(); }, 10);
        });
        exportLatex();
    }

    function rotateSelected() { selectedElements.forEach(el => { if(el.get('latexMacro') !== 'connectordot') el.rotate(90); }); exportLatex(); }

	function flipHorizontal() {
        selectedElements.forEach(el => {
            if(el.get('latexMacro') !== 'connectordot') {
                el.set('flipH', !(el.get('flipH') || false));
                applyRobustScale(el, el.get('customScale') || 1); // Το κάνει όλα η scale!
            }
        });
        forceExportLatex();
    }

    function flipVertical() {
        selectedElements.forEach(el => {
            if(el.get('latexMacro') !== 'connectordot') {
                el.set('flipV', !(el.get('flipV') || false));
                applyRobustScale(el, el.get('customScale') || 1);
            }
        });
        forceExportLatex();
    }
	
	// --- ΣΥΝΑΡΤΗΣΗ ΑΛΛΑΓΗΣ ΚΛΙΜΑΚΑΣ ΜΕ PREDEFINED STEPS ---
	const USER_SCALES = [0.25, 0.5, 1, 2, 4]; // Τα scales που ΒΛΕΠΕΙ ο χρήστης και το LaTeX (χάρη στο Fake Scaling, τώρα δεχόμαστε δεκαδικά!)

	// --- ΡΩΜΑΛΕΟ SCALING (Τέλειο Bounding Box, Σταθερά Labels) ---
    function applyRobustScale(el, newScale) {
        if (el.get('baseWidth') === undefined) {
            el.set('baseWidth', el.size().width);
            el.set('baseHeight', el.size().height);
            el.set('baseOffsetX', el.get('offsetX'));
            el.set('baseOffsetY', el.get('offsetY'));
            let initialBasePorts = {};
            el.getPorts().forEach(p => { initialBasePorts[p.id] = { x: p.args.x, y: p.args.y }; });
            el.set('basePorts', initialBasePorts);
            el.set('baseShiftX', el.get('shiftX') || 0);
            el.set('baseShiftY', el.get('shiftY') || 0);
        }

        let w = Math.round(el.get('baseWidth') * newScale);
        let h = Math.round(el.get('baseHeight') * newScale);

        el.set('offsetX', Math.round(el.get('baseOffsetX') * newScale));
        el.set('offsetY', Math.round(el.get('baseOffsetY') * newScale));

        let shiftX = el.get('baseShiftX') * newScale;
        let shiftY = el.get('baseShiftY') * newScale;
        let totalScale = newScale * PPU_MULT; 

        let flipH = el.get('flipH') || false;
        let flipV = el.get('flipV') || false;
        let sx = flipH ? -1 : 1;
        let sy = flipV ? -1 : 1;

        el.attr('icon/transform', `translate(${w/2}, ${h/2}) scale(${sx}, ${sy}) translate(${-w/2}, ${-h/2}) translate(${shiftX}, ${shiftY}) scale(${totalScale})`);

        // ΛΥΣΗ SCALE DOWN: Μετακινούμε ΠΡΩΤΑ τα Ports...
        let basePorts = el.get('basePorts');
        el.getPorts().forEach(port => {
            let px = basePorts[port.id].x * newScale;
            let py = basePorts[port.id].y * newScale;
            if (flipH) px = w - px;
            if (flipV) py = h - py;
            el.portProp(port.id, 'args/x', Math.round(px));
            el.portProp(port.id, 'args/y', Math.round(py));
        });

        // ...ΚΑΙ ΜΕΤΑ κάνουμε resize το κουτί! Έτσι δεν "σκαλώνει" στα παλιά, ανοιχτά pins.
        el.resize(w, h);

        updateElementLabel(el); 

        el.set('customScale', newScale);
    }

    function deleteSelected() { [...selectedElements, ...selectedLinks].forEach(c => c.remove()); clearSelection(); exportLatex(); }

    $(document).on('keydown', function(e) {
        if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return; 
        if (e.ctrlKey && (e.key === 'c' || e.key === 'C')) copySelected();
        else if (e.ctrlKey && (e.key === 'v' || e.key === 'V')) pasteCopied();
        else if (e.key === 'Delete' || e.key === 'Backspace') deleteSelected();
    });


	// --- 5. ΣΥΣΤΗΜΑ ΕΞΑΡΤΗΜΑΤΩΝ (Τελική Διόρθωση Thumbnails) ---
    if (typeof JL_DATABASE !== 'undefined') {
        const list = document.getElementById('items-container');
        Object.keys(JL_DATABASE).sort().forEach(k => {
            const data = JL_DATABASE[k];
            const d = document.createElement('div');
            d.className = 'comp-item';
            
            let iconSvg = '';
			if (k === 'connectordot') {
                // radius 3 αντί για 6 για να είναι διακριτικό
                iconSvg = `<svg width="100%" height="100%" viewBox="-15 -15 30 30">
                               <circle cx="0" cy="0" r="3" fill="#2c3e50"/>
                           </svg>`;
            }
			else if (data.icon) {
				// 1. Βρίσκουμε τα όρια των Pins (Αυτά είναι ΗΔΗ 4x)
                const xs = data.pins.map(p => p.x), ys = data.pins.map(p => p.y);
                let minX = xs.length ? Math.min(...xs) : 0;
                let maxX = xs.length ? Math.max(...xs) : 0;
                let minY = ys.length ? Math.min(...ys) : 0;
                let maxY = ys.length ? Math.max(...ys) : 0;

                // 2. Μετράμε το BBox του SVG (Το SVG είναι 1x, πρέπει να το κάνουμε 4x!)
                let bbox = { x: 0, y: 0, width: 0, height: 0 };
                if (data.icon) {
                    const tempPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    tempPath.setAttribute('d', data.icon);
                    const svgContainer = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    svgContainer.appendChild(tempPath);
                    document.body.appendChild(svgContainer);
                    try { bbox = tempPath.getBBox(); } catch(e){}
                    document.body.removeChild(svgContainer);
                }

                // Φέρνουμε το Path στα μέτρα των Pins
                const pathMinX = bbox.x * PPU_MULT;
                const pathMaxX = (bbox.x + bbox.width) * PPU_MULT;
                const pathMinY = bbox.y * PPU_MULT;
                const pathMaxY = (bbox.y + bbox.height) * PPU_MULT;

                minX = Math.min(minX, pathMinX);
                maxX = Math.max(maxX, pathMaxX);
                minY = Math.min(minY, pathMinY);
                maxY = Math.max(maxY, pathMaxY);

                // Fallback για εξαρτήματα με 0 ή 1 Pin (να μην βγάζουν Width=0)
                let w = maxX - minX;
                let h = maxY - minY;
                if (w === 0) { w = 40; minX -= 20; maxX += 20; }
                if (h === 0) { h = 40; minY -= 20; maxY += 20; }

                // 4. Padding 20%
                const padW = Math.max(w * 0.2, 10);
                const padH = Math.max(h * 0.2, 10);

                const vbX = minX - padW;
                const vbY = minY - padH;
                const vbW = w + (padW * 2);
                const vbH = h + (padH * 2);

                iconSvg = `
                    <svg width="100%" height="100%" viewBox="${vbX} ${vbY} ${vbW} ${vbH}" preserveAspectRatio="xMidYMid meet">
                        <path d="${data.icon}" transform="scale(${PPU_MULT})"
                              style="vector-effect: non-scaling-stroke;" 
                              stroke="#2c3e50" stroke-width="2.5" fill="none" 
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>`;
            }
            
			d.innerHTML = `
                <div style="display: flex; align-items: center; gap: 12px; width: 100%;">
                    <div class="icon-wrapper" style="width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: #ffffff; border: 1px solid #d1d8e0; border-radius: 6px; padding: 4px; box-sizing: border-box; overflow: hidden;">
                        ${iconSvg}
                    </div>
                    <span style="font-weight: 500; font-size: 13px; color: #2c3e50; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                        ${data.name}
                    </span>
                </div>
            `;
            
            // --- ΝΕΟ: Drag and Drop Setup με Custom Drag Image ---
            d.draggable = true;
            d.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('application/jl-component', k);
                e.dataTransfer.effectAllowed = 'copy';
                
                // Βρίσκουμε ΜΟΝΟ το εικονίδιο
                const iconNode = d.querySelector('.icon-wrapper');
                if (iconNode) {
                    // Θέτουμε το εικονίδιο ως "φάντασμα" 
                    // Το 21, 21 κεντράρει το ποντίκι ακριβώς στη μέση του κουτιού 42x42!
                    e.dataTransfer.setDragImage(iconNode, 21, 21);
                }
            });
            // --------------------------------
            
            d.onclick = () => addComponent(k);
            list.appendChild(d);
        });
    }
	
	
	function addComponent(type, dropX = null, dropY = null) {
        const data = JL_DATABASE[type];
        let element;
        const rect = container.getBoundingClientRect();
        
        // --- ΕΞΥΠΝΟΣ ΥΠΟΛΟΓΙΣΜΟΣ ΘΕΣΗΣ (Κλικ vs Drag) ---
        let targetPos;
        if (dropX !== null && dropY !== null) {
            // Ήρθε από Drag & Drop: Μετατροπή των συντεταγμένων της οθόνης σε συντεταγμένες καμβά
            targetPos = paper.clientToLocalPoint({ x: dropX, y: dropY });
        } else {
            // Ήρθε από κλικ: Το βάζουμε στο κέντρο της οθόνης
            targetPos = paper.clientToLocalPoint({ x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 });
        }
        
        const snappedX = Math.round(targetPos.x / 10) * 10;
        const snappedY = Math.round(targetPos.y / 10) * 10;
        
        if (type === 'connectordot') {
            element = new joint.shapes.jl.ConnectorDot();
            element.addPort({ id: 'p1', group: 'absolute', args: {x: 10, y: 10}, markup: '<g/>' });
            element.set({'latexMacro': 'connectordot', 'offsetX': -10, 'offsetY': -10});
            element.position(snappedX - 10, snappedY - 10);
		} else {
			element = new joint.shapes.jl.Component();

            let iconPath = data.icon || ''; 

			// Καθαρισμός διπλότυπων Pins (και διατήρηση των Labels)
            const uniquePins = [];
            const seenIds = new Set();
            data.pins.forEach(p => {
                if (!seenIds.has(p.id)) { 
                    seenIds.add(p.id); 
                    uniquePins.push(p); 
                } else {
                    const existing = uniquePins.find(up => up.id === p.id);
                    if (existing && !existing.label && p.label) existing.label = p.label;
                }
            });

            // Bulletproof Μέτρηση του SVG
            let bbox = { x: 0, y: 0, width: 0, height: 0 };
            if (iconPath) {
                const tempSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                tempSvg.setAttribute('width', '500'); tempSvg.setAttribute('height', '500');
                const tempPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                tempPath.setAttribute('d', iconPath);
				tempPath.setAttribute('transform', `scale(${PPU_MULT})`); // --- ΝΕΟ: Ζητάμε από τον Browser να μετρήσει το SVG 4 φορές μεγαλύτερο! ---
                tempSvg.appendChild(tempPath);
                Object.assign(tempSvg.style, { position: 'absolute', top: '-9999px', opacity: 0.01, pointerEvents: 'none' });
                document.body.appendChild(tempSvg);
                try { 
                    const b = tempPath.getBBox(); 
                    if (b.width > 0 || b.height > 0) bbox = b;
                } catch(e) {}
                document.body.removeChild(tempSvg);
            }

            // Απόλυτα Όρια: Tα Pins και το SVG βρίσκονται ΉΔΗ στο ίδιο σύστημα συντεταγμένων!
            const xs = uniquePins.map(p => p.x), ys = uniquePins.map(p => p.y);
            const minPinX = xs.length ? Math.min(...xs) : 0;
            const maxPinX = xs.length ? Math.max(...xs) : 0;
            const minPinY = ys.length ? Math.min(...ys) : 0;
            const maxPinY = ys.length ? Math.max(...ys) : 0;

            const absMinX = bbox.width > 0 ? Math.min(minPinX, bbox.x) : minPinX;
            const absMaxX = bbox.width > 0 ? Math.max(maxPinX, bbox.x + bbox.width) : maxPinX;
            const absMinY = bbox.height > 0 ? Math.min(minPinY, bbox.y) : minPinY;
            const absMaxY = bbox.height > 0 ? Math.max(maxPinY, bbox.y + bbox.height) : maxPinY;
				
			// Snapping Bounding Box στο Grid (10px για τέλεια εφαρμογή με το νέο gridSize)
            const pad = 10; 
            const boxOriginX = Math.floor((absMinX - pad) / 10) * 10;
            const boxOriginY = Math.floor((absMinY - pad) / 10) * 10;
            const boxMaxX = Math.ceil((absMaxX + pad) / 10) * 10;
            const boxMaxY = Math.ceil((absMaxY + pad) / 10) * 10;

            const boxWidth = Math.max(boxMaxX - boxOriginX, 40);
            const boxHeight = Math.max(boxMaxY - boxOriginY, 40);

            const shiftX = -boxOriginX;
            const shiftY = -boxOriginY;

			element.resize(boxWidth, boxHeight);
			element.attr({ 
                body: { 
                    fill: '#ffffff',        
                    fillOpacity: 0.01,  // Λύνει το θέμα με το Hitbox
                    stroke: 'none', 
                    'pointer-events': 'all',
                    cursor: 'pointer'   // Διώχνει το "χεράκι"
                },
                icon: {
                    d: iconPath, stroke: '#2c3e50', strokeWidth: 1.8, fill: 'none', 
                    transform: `translate(${shiftX}, ${shiftY}) scale(${PPU_MULT})`, 
                    'vector-effect': 'non-scaling-stroke' 
                },
				label: { 
                    text: data.name, 
                    fontSize: 12 * PPU_MULT, 
                    fill: '#34495e', 
                    refX: '50%', textAnchor: 'middle', 
                    refY: '50%', // Αγκίστρωση στο ΚΕΝΤΡΟ του εξαρτήματος (δεν επηρεάζεται από το Rotate!)
                    refY2: 25 * PPU_MULT, // Σταθερή μετατόπιση προς τα κάτω
                    'pointer-events': 'none'
                }
            });
			
			// Αν είναι το εργαλείο Κειμένου, κρύβουμε το εικονίδιο και κεντράρουμε το κείμενο!
            if (type === 'freetext') {
                element.attr('icon/stroke', 'transparent'); // Κάνουμε το "T" αόρατο
                element.attr('label/refY', '50%');          // Το φέρνουμε ακριβώς στο κέντρο
                element.attr('label/refY2', 0);
                element.attr('label/fontSize', 14 * PPU_MULT); // Λίγο πιο μεγάλο
            }

            const ports = uniquePins.map(p => ({ 
                id: p.id, group: 'absolute', 
                args: { x: p.x + shiftX, y: p.y + shiftY }, 
                markup: [
                    { tagName: 'rect', selector: 'portBody' },
                    { tagName: 'title', selector: 'portTitle' }, 
                    { tagName: 'text', selector: 'portLabel' }   
                ],
                attrs: { 
                    portBody: { width: 8 * PPU_MULT, height: 8 * PPU_MULT, x: -4 * PPU_MULT, y: -4 * PPU_MULT, fill: '#ff9800' },
                    portTitle: { text: p.label || p.id },
                    portLabel: { 
                        text: p.label || '', display: showPinNames ? 'block' : 'none',
                        fontSize: 9 * PPU_MULT, // Κανονικό μέγεθος για τα Pin Names!
                        fill: '#c0392b', fontWeight: 'bold', fontFamily: 'monospace',
                        x: 6 * PPU_MULT, y: -6 * PPU_MULT, textAnchor: 'start' 
                    }
                } 
            }));
            
            // Αποθήκευση των "Αρχικών" θέσεων των pins για τέλειο Scaling
            let basePorts = {};
            ports.forEach(p => { basePorts[p.id] = { x: p.args.x, y: p.args.y }; });

            element.prop('ports', { groups: { 'absolute': { position: { name: 'absolute' } } } });
            element.addPorts(ports);
            element.set({
                'latexMacro': data.name, 
                'offsetX': boxOriginX, 'offsetY': boxOriginY,
                'shiftX': shiftX, 'shiftY': shiftY,
                'flipH': false, 'flipV': false,
                'customArgs': [], 'customScale': 1,
                'baseWidth': boxWidth, 'baseHeight': boxHeight,
                'baseOffsetX': boxOriginX, 'baseOffsetY': boxOriginY,
                'baseShiftX': shiftX, 'baseShiftY': shiftY,
                'basePorts': basePorts
            });
            
			// ΑΠΟΛΥΤΟ SNAPPING: Κουμπώνουμε το μαθηματικό (0,0) του εξαρτήματος πάνω στο Grid των 10px (0.25 TikZ)
            let snappedOriginX = Math.round(targetPos.x / 10) * 10;
            let snappedOriginY = Math.round(targetPos.y / 10) * 10;
            
            // Η τελική θέση (πάνω αριστερή γωνία του box) 
            let finalX = snappedOriginX - shiftX;
            let finalY = snappedOriginY - shiftY;
            
            if (type === 'freetext') element.attr('icon/stroke', 'transparent'); 
            updateElementLabel(element, data.name); 
            
            element.position(finalX, finalY);
        }
        graph.addCell(element); clearSelection(); selectedElements.push(element);
        setTimeout(() => { const v = paper.findViewByModel(element); if(v) v.highlight(); }, 10);
        exportLatex();
    }

	// --- 6. ΚΑΛΩΔΙΑ ---
    $('#tool-draw').click(function() { $('#draw-glasspane').show(); $('.tool-btn').removeClass('active'); $(this).addClass('active'); });
    $('#tool-pan').click(function() { $('#draw-glasspane').hide(); $('.tool-btn').removeClass('active'); $(this).addClass('active'); });

	let drawing = false, wire = null;
    $('#draw-glasspane').on('mousedown', function(e) {
        drawing = true;
        let p = paper.clientToLocalPoint({x: e.clientX, y: e.clientY});
        let s = { x: Math.round(p.x/10)*10, y: Math.round(p.y/10)*10 }; // Μαγνήτης στα 10
        wire = new joint.shapes.standard.Link({ source: s, target: s, attrs: { line: { stroke: '#333', strokeWidth: 2 * PPU_MULT, targetMarker: null } } });
        wire.addTo(graph);
    });
    $(document).on('mousemove', function(e) {
        if (!drawing) return;
        let p = paper.clientToLocalPoint({x: e.clientX, y: e.clientY});
        let tx = Math.round(p.x/10)*10, ty = Math.round(p.y/10)*10;     // Μαγνήτης στα 10
        let s = wire.source();
        if (Math.abs(tx - s.x) > Math.abs(ty - s.y)) wire.target({ x: tx, y: s.y });
        else wire.target({ x: s.x, y: ty });
    }).on('mouseup', function() { if (drawing) { drawing = false; exportLatex(); } });

    // --- 7. EXPORT HTML/TEXT & CODE HIGHLIGHTING ---
    function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])); }

	// ΝΕΑ ΣΥΝΑΡΤΗΣΗ: Εφαρμόζει χρώματα στον κώδικα
    function highlightLatex(text) {
        let html = text;
        // 1. Βάφει τις εντολές (π.χ. \draw, \connectordot)
        html = html.replace(/(\\[a-zA-Z]+)/g, '<span class="tex-cmd">$1</span>');
        // 2. Βάφει τα placeholders και το $NAME$
        html = html.replace(/(\$NAME\$|\{\.\.\.\}|type "[^"]+" to [^}]+)/g, '<span class="tex-place">$1</span>');
		// 3. Βάφει τις αγκύλες {} και []
        html = html.replace(/([{}\[\]])/g, '<span class="tex-brace">$1</span>');
        return html;
    }

	function exportLatex() {
        // Αν ΔΕΝ έχει πειραχτεί ο κώδικας Ή έχει τσεκαριστεί το "Μην με ξαναρωτήσεις"
        if (!latexEdited || suppressWarning) {
            forceExportLatex();
            return;
        }

        // Αν το παράθυρο είναι ήδη ανοιχτό, αγνοούμε τα πολλαπλά events (πχ κατά το σύρσιμο)
        if (isSwalOpen) return;

        isSwalOpen = true;
        Swal.fire({
            title: 'Προσοχή: Χειροκίνητος Κώδικας!',
            html: `
                <p style="font-size: 14px; color: #34495e;">Έχετε κάνει χειροκίνητες επεξεργασίες στον κώδικα LaTeX.<br>Αν ενημερωθεί ο κώδικας από τον καμβά, οι αλλαγές σας <b>θα διαγραφούν</b>.</p>
                <label style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 15px; font-size: 13px; cursor: pointer;">
                    <input type="checkbox" id="swal-dont-ask" style="width: 16px; height: 16px;">
                    Μην με ξαναρωτήσεις (για αυτή τη συνεδρία)
                </label>
            `,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#e74c3c',
            cancelButtonColor: '#95a5a6',
            confirmButtonText: 'Ναι, Overwrite',
            cancelButtonText: 'Διατήρηση Αλλαγών μου',
			preConfirm: () => {
                // Επιστρέφουμε ένα object ώστε το Swal να μην το δει ποτέ ως 'false'
                return { isChecked: document.getElementById('swal-dont-ask').checked };
            }
        }).then((result) => {
            isSwalOpen = false;
            if (result.isConfirmed) {
                // Αν ο χρήστης πάτησε "Ναι, Overwrite"
                if (result.value && result.value.isChecked) {
                    suppressWarning = true; // Αποθηκεύουμε την επιλογή του Checkbox
                }
                forceExportLatex(); // Κάνουμε την εξαγωγή
            }
        });
    }

    function forceExportLatex() {
		latexEdited = false;
        let outText = "\\begin{tikzpictureJL}\n";
        let outHTML = "\\begin{tikzpictureJL}\n";
        const isSelected = (id) => selectedElements.some(e=>e.id===id) || selectedLinks.some(l=>l.id===id);

        graph.getElements().forEach(el => {
            const p = el.position(), macro = el.get('latexMacro');
            let line = "";
            if (macro === 'connectordot') {
                line = "  \\connectordot{(" + ((p.x + 10) / EXPORT_DIV).toFixed(2) + "," + (-(p.y + 10) / EXPORT_DIV).toFixed(2) + ")}\n";
			} else {
				// --- ΕΞΥΠΝΟΣ ΥΠΟΛΟΓΙΣΜΟΣ OFFSET ΓΙΑ FLIP & ROTATION ---
                const rot = el.get('angle') || 0;
                const w = el.size().width;
                const h = el.size().height;
                let effOffsetX = el.get('offsetX');
                let effOffsetY = el.get('offsetY');
                
                // 1. Εφαρμογή του Flip (αντανακλά το (0,0) γύρω από το κέντρο)
                if (el.get('flipH')) effOffsetX = -w - effOffsetX;
                if (el.get('flipV')) effOffsetY = -h - effOffsetY;

                // 2. Το σημείο (0,0) του TikZ (ΠΡΙΝ την περιστροφή)
                const ox = p.x - effOffsetX;
                const oy = p.y - effOffsetY;

                // 3. Το κέντρο του Bounding Box (γύρω από το οποίο περιστρέφει το JointJS)
                const cx = p.x + w / 2;
                const cy = p.y + h / 2;

                // 4. Εφαρμογή της Περιστροφής (Rotation 2D Matrix γύρω από το κέντρο)
                const rad = rot * Math.PI / 180;
                const cos = Math.cos(rad);
                const sin = Math.sin(rad);

                const dx = ox - cx;
                const dy = oy - cy;

                // Υπολογίζουμε τις νέες συντεταγμένες και τις στρογγυλοποιούμε 
                // για να αποφύγουμε σφάλματα δεκαδικών π.χ. (cos(90) = 0.0000000001)
                const rotatedOx = Math.round(cx + (dx * cos) - (dy * sin));
                const rotatedOy = Math.round(cy + (dx * sin) + (dy * cos));

                // Υπολογισμός τελικών συντεταγμένων
				const tx = (rotatedOx / EXPORT_DIV).toFixed(2);
				const ty = (-(rotatedOy) / EXPORT_DIV).toFixed(2);
                // ---------------------------------------------------------

                // Υπολογισμός του Flip String
                const flipH = el.get('flipH') || false;
                const flipV = el.get('flipV') || false;
                let flipStr = 'none'; // Προεπιλογή "none"
                if (flipH && flipV) flipStr = 'hv';
                else if (flipH) flipStr = 'h';
                else if (flipV) flipStr = 'v';

                const data = JL_DATABASE[macro];
                const argsCount = (data && data.argsCount) ? data.argsCount : 7;
                const argNames = (data && data.argNames) ? data.argNames : [];
                
				let args = [];
				for (let i = 0; i < argsCount; i++) {
                    let argDef = argNames[i] || { name: '', optional: false };
                    let desc = argDef.name.toLowerCase();
                    let isOpt = argDef.optional;
                    
                    // Διαβάζουμε τις αποθηκευμένες ρυθμίσεις του χρήστη
                    let customArgs = el.get('customArgs') || [];
                    let innerVal = "...";

                    if (desc.includes('position')) {
                        innerVal = `(${tx},${ty})`;
                    } else if (desc.includes('rotation')) {
                        if (desc.includes('flip')) innerVal = `${rot},${flipStr}`;
                        else innerVal = `${rot}`;
					} else {
                        // ΑΝ Ο ΧΡΗΣΤΗΣ ΕΧΕΙ ΔΩΣΕΙ ΤΙΜΗ (Ακόμα και αν την έσβησε / έκανε κενή), ΧΡΗΣΙΜΟΠΟΙΗΣΕ ΤΗΝ
                        if (customArgs[i] !== undefined) {
                            innerVal = customArgs[i];
                        } else {
                            // Αλλιώς βάλε τις Default (όταν πρωτο-μπαίνει το εξάρτημα)
                            if (desc === 'name') innerVal = `$NAME$`;
                            else if (desc === 'text') innerVal = ``; // Προσθήκη: Το freetext ξεκινάει εξ ορισμού κενό (ή με το όνομά του)
                            else if (desc.includes('grid')) innerVal = `type "gridon" to show grid`;
                            else if (desc.includes('show')) innerVal = `type "show" to display (0,0)`;
                            else if (argDef.name.includes('/')) innerVal = argDef.name.split('/')[0].trim(); // Παίρνει το 1ο (π.χ. 'n' από 'n/p')
                            else innerVal = argDef.name ? argDef.name : "...";
                        }
                    }
                    
                    if (isOpt) args.push(`[${innerVal}]`);
                    else args.push(`{${innerVal}}`);
                }

				// --- ΕΞΑΓΩΓΗ MACRO, SCALE ΚΑΙ HIDDEN ID ---
                let currentScale = el.get('customScale') || 1;
                // Προσθέτουμε το % id: για τον αμφίδρομο συγχρονισμό!
                let finalMacroLine = "  \\" + macro + args.join("") + " % id:" + el.id + "\n";

                if (currentScale !== 1) {
                    let scaleOn = `  \\setscale{${currentScale}}\n`;
                    let scaleOff = `  \\setscale{1}\n`;
                    line = scaleOn + finalMacroLine + scaleOff;
                } else {
                    line = finalMacroLine;
                }
            } // Τέλος της μεγάλης else (όχι connectordot)

            outText += line;
            let safeLine = highlightLatex(escapeHTML(line));
            if (isSelected(el.id)) outHTML += `<span class="highlight">${safeLine}</span>`;
            else outHTML += safeLine;
        });

		let segments = [];
        graph.getLinks().forEach(link => {
            let pts = [link.getSourcePoint(), ...(link.vertices() || []), link.getTargetPoint()];
            for (let i = 0; i < pts.length - 1; i++) {
                // Απόλυτη στρογγυλοποίηση στον κοντινότερο ακέραιο της δεκάδας 
                // για να "κουμπώνουν" τέλεια τα καλώδια στα pins
					let x1 = ((Math.round(pts[i].x / 10) * 10) / EXPORT_DIV).toFixed(2);
					let y1 = ((Math.round(-pts[i].y / 10) * 10) / EXPORT_DIV).toFixed(2);
					let x2 = ((Math.round(pts[i+1].x / 10) * 10) / EXPORT_DIV).toFixed(2);
					let y2 = ((Math.round(-pts[i+1].y / 10) * 10) / EXPORT_DIV).toFixed(2);
                
                segments.push({ 
                    linkId: link.id, 
                    p1: `${x1},${y1}`, 
                    p2: `${x2},${y2}` 
                });
            }
        });

        let paths = [];
        while (segments.length > 0) {
            let seg = segments.shift();
            let currentPath = [seg.p1, seg.p2], currentLinkIds = new Set([seg.linkId]), added = true;
            while (added) {
                added = false;
                for (let i = 0; i < segments.length; i++) {
                    let s = segments[i];
                    if (s.p1 === currentPath[currentPath.length - 1]) { currentPath.push(s.p2); currentLinkIds.add(s.linkId); segments.splice(i, 1); added = true; break; } 
                    else if (s.p2 === currentPath[currentPath.length - 1]) { currentPath.push(s.p1); currentLinkIds.add(s.linkId); segments.splice(i, 1); added = true; break; } 
                    else if (s.p2 === currentPath[0]) { currentPath.unshift(s.p1); currentLinkIds.add(s.linkId); segments.splice(i, 1); added = true; break; } 
                    else if (s.p1 === currentPath[0]) { currentPath.unshift(s.p2); currentLinkIds.add(s.linkId); segments.splice(i, 1); added = true; break; }
                }
            }
            paths.push({ points: currentPath, linkIds: Array.from(currentLinkIds) });
        }

        paths.forEach(pathObj => {
            let line = "  \\draw (" + pathObj.points.join(") -- (") + ");\n";
            outText += line;
			let safeLine = highlightLatex(escapeHTML(line));
            if (pathObj.linkIds.some(id => isSelected(id))) outHTML += `<span class="highlight">${safeLine}</span>`;
            else outHTML += safeLine;
        });

        outText += "\\end{tikzpictureJL}";
        outHTML += "\\end{tikzpictureJL}";
        
		window.rawLatexCode = outText; 
        document.getElementById('latex-output').innerHTML = outHTML;
        
        // --- ΝΕΟ: Αυτόματο Scroll στο Highlight ---
        setTimeout(() => {
            const highlightedEl = document.querySelector('#latex-output .highlight');
            if (highlightedEl) {
                // Το block: 'center' το φέρνει όμορφα στη μέση του παραθύρου!
                highlightedEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }, 50); // Δίνουμε 50ms περιθώριο στον browser να "χωνέψει" το νέο HTML
    }

	// --- 8. SAVE / LOAD / DOWNLOAD (ΜΕ NATIVE SAVE DIALOG) ---

    // Νέα έξυπνη συνάρτηση που καλεί το "Save As" του λειτουργικού
    async function saveFileAs(content, defaultFilename, mimeType, description) {
        // Ελέγχουμε αν ο browser υποστηρίζει το σύγχρονο File System API (Chrome, Edge, Opera)
        if (window.showSaveFilePicker) {
            try {
                const handle = await window.showSaveFilePicker({
                    suggestedName: defaultFilename,
                    types: [{
                        description: description,
                        accept: { [mimeType]: [defaultFilename.substring(defaultFilename.lastIndexOf('.'))] },
                    }],
                });
                const writable = await handle.createWritable();
                await writable.write(content);
                await writable.close();
            } catch (err) {
                // Ο χρήστης πάτησε "Ακύρωση" στο παράθυρο, δεν κάνουμε τίποτα.
                if (err.name !== 'AbortError') console.error('Αποτυχία αποθήκευσης:', err);
            }
        } else {
            // Fallback για Firefox / Safari (κλασικό κατέβασμα)
            const blob = new Blob([content], { type: mimeType });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = defaultFilename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
        }
    }

    function saveProject() { 
        const currentLatex = document.getElementById('latex-output').innerText;
        graph.set('customLatex', currentLatex);
        
        const jsonString = JSON.stringify(graph.toJSON());
        saveFileAs(jsonString, 'circuit.json', 'application/json', 'JointJS Diagram');
    }

                let indentedTikz = scaledTikz.split('\n').map(line => '\t' + line).join('\n');

                // 3. Δημιουργία του τελικού Standalone με τα σωστά tabs
                finalOutput = `\\documentclass{standalone}

        const r = new FileReader(); 
        r.onload = ev => {
            graph.fromJSON(JSON.parse(ev.target.result)); 
            zoomFit();

			const savedLatex = graph.get('customLatex');

                window.rawLatexCode = savedLatex;

	function runLinterUI(onSuccessCallback = null) {
        const rawText = document.getElementById('latex-output').innerText;
        const errors = validateLatexSyntax(rawText);
        
        if (errors.length === 0) {
            if (onSuccessCallback) {
                onSuccessCallback(rawText); // Αν κλήθηκε από Copy/Download, προχώρα κατευθείαν
            } else {
                // Αν ο χρήστης πάτησε απλά "Check Syntax", δείξε του ότι όλα είναι τέλεια!
                Swal.fire({
                    icon: 'success',
                    title: 'Κώδικας Άψογος!',
                    text: 'Δεν βρέθηκαν συντακτικά σφάλματα.',
                    timer: 1500,
                    showConfirmButton: false
                });
            }
        } else {
            // Αν βρέθηκαν λάθη, δείξε τη λίστα!
            const errorHtml = `<ul style="text-align: left; font-size: 14px; color: #c0392b; background: #fad390; padding: 15px; border-radius: 5px;">` + 
                              errors.map(e => `<li style="margin-bottom: 8px;">${e}</li>`).join('') + 
                              `</ul>`;
            
            Swal.fire({
                icon: 'error',
                title: 'Βρέθηκαν Συντακτικά Λάθη',
                html: errorHtml,
                showCancelButton: onSuccessCallback ? true : false,
                confirmButtonText: onSuccessCallback ? 'Αγνόηση & Συνέχεια' : 'ΟΚ, θα τα φτιάξω',
                cancelButtonText: 'Ακύρωση',
                confirmButtonColor: '#e74c3c'
            }).then((result) => {
                // Αν ο χρήστης αποφασίσει να τα αγνοήσει και να προχωρήσει (π.χ. στο Export)
                if (result.isConfirmed && onSuccessCallback) {
                    onSuccessCallback(rawText);
                }
            });
        }
    }

                Swal.fire({ icon: 'success', title: 'Αντιγράφηκε!', timer: 1000, showConfirmButton: false });
            });
        });
    }

	
	// --- 9. LATEX LINTER (ΣΥΝΤΑΚΤΙΚΟΣ ΕΛΕΓΧΟΣ) ---
    function validateLatexSyntax(text) {
        let errors = [];
        
        // 1. Έλεγχος Συνολικής Ισορροπίας Αγκυλών { }
        let openBraces = (text.match(/\{/g) || []).length;
        let closeBraces = (text.match(/\}/g) || []).length;
        if (openBraces !== closeBraces) {
            errors.push(`<b>Ανισορροπία Αγκυλών:</b> Βρέθηκαν ${openBraces} ανοιχτές <code>{</code> και ${closeBraces} κλειστές <code>}</code>.`);
        }
        
        // Λίστα με τις στάνταρ εντολές του TikZ που επιτρέπουμε
        const knownSystemMacros = ['begin', 'end', 'draw', 'tikzpictureJL', 'connectordot', 'setscale'];
        const macroRegex = /\\([a-zA-Z]+)/g;
        let match;
        
        // Σαρώνουμε όλο το κείμενο για εντολές που ξεκινάνε με \
        while ((match = macroRegex.exec(text)) !== null) {
            const macroName = match[1];
            const macroIndex = match.index;
            
            // 2. Έλεγχος αν η εντολή υπάρχει
            if (!knownSystemMacros.includes(macroName) && (!JL_DATABASE || !JL_DATABASE[macroName])) {
                errors.push(`<b>Άγνωστη εντολή:</b> <code>\\${macroName}</code>. Μήπως υπάρχει τυπογραφικό λάθος;`);
                continue;
            }
            
            // 3. Έλεγχος Ορισμάτων (μόνο για τα εξαρτήματα της βάσης μας)
            if (JL_DATABASE && JL_DATABASE[macroName]) {
                const expectedArgs = JL_DATABASE[macroName].argsCount || 7;
                let argCount = 0;
                let i = macroIndex + match[0].length;
                
                // Σαρώνουμε γραμμικά για να πιάσουμε σωστά τα φωλιασμένα {} και []
                while (i < text.length) {
                    let char = text[i];
                    
                    // Αγνοούμε τα κενά ανάμεσα στα ορίσματα
                    if (char === ' ' || char === '\n' || char === '\r' || char === '\t') { i++; continue; }
                    
                    if (char === '{' || char === '[') {
                        argCount++;
                        let openChar = char;
                        let closeChar = char === '{' ? '}' : ']';
                        let depth = 1;
                        i++;
                        // Προχωράμε μέχρι να κλείσει το τρέχον όρισμα (ακόμα κι αν έχει μέσα άλλα {})
                        while (i < text.length && depth > 0) {
                            if (text[i] === openChar) depth++;
                            else if (text[i] === closeChar) depth--;
                            i++;
                        }
                    } else {
                        // Βρήκαμε κάτι άλλο (π.χ. κανονικό κείμενο ή νέα εντολή), άρα σταματάμε το μέτρημα για αυτή την εντολή
                        break;
                    }
                }
                
                if (argCount !== expectedArgs) {
                    errors.push(`<b>Λάθος αριθμός ορισμάτων στην εντολή <code>\\${macroName}</code>:</b><br>Βρέθηκαν ${argCount}, ενώ η βιβλιοθήκη απαιτεί ${expectedArgs}.`);
                }
            }
        }
        
        return errors;
    }
	
	// --- 10. PROPERTY EDITOR (ΔΙΠΛΟ ΚΛΙΚ) ---
    paper.on('cell:pointerdblclick', function(cellView) {
        let el = cellView.model;
        if (el.isLink() || el.get('latexMacro') === 'connectordot') return;

        let macro = el.get('latexMacro');
        let data = JL_DATABASE[macro];
        if (!data) return;

        let currentArgs = el.get('customArgs') || [];
        let htmlForm = '<div style="text-align: left; font-size: 14px;">';

        // Το variant_arg έρχεται ως 1-based, εμείς το θέλουμε 0-based για τα arrays
        let variantIndex = data.variantArg ? data.variantArg - 1 : -1;
		
		let currentScale = el.get('customScale') || 1;
        // Προσθήκη του Scale Selector
        htmlForm += `<div style="margin-bottom: 12px; border-bottom: 1px solid #ccc; padding-bottom: 10px;">
                        <label style="display:block; margin-bottom: 4px; font-weight: 600; color: #2c3e50; font-size: 12px;">Κλίμακα / Scale (TikZ)</label>
                        <select id="swal-input-scale" class="swal2-input" style="width: 100%; height: 35px; font-size: 14px; margin: 0; padding: 0 10px;">
                            <option value="0.25" ${currentScale === 0.25 ? 'selected' : ''}>0.25x</option>
                            <option value="0.5" ${currentScale === 0.75 ? 'selected' : ''}>0.5x</option>
                            <option value="1"    ${currentScale === 1 ? 'selected' : ''}>1x</option>
                            <option value="2"    ${currentScale === 2 ? 'selected' : ''}>2x</option>
                            <option value="4"    ${currentScale === 4 ? 'selected' : ''}>4x</option>
                        </select>
                    </div>`;

        for (let i = 0; i < data.argsCount; i++) {
            let argDef = data.argNames[i] || { name: `Arg ${i+1}` };
            let desc = argDef.name.toLowerCase();
            let val = currentArgs[i] !== undefined ? currentArgs[i] : "";

            // Κλειδώνουμε τη Θέση και την Περιστροφή (υπολογίζονται αυτόματα)
            let isReadOnly = desc.includes('position') || desc.includes('rotation');
            
            htmlForm += `<div style="margin-bottom: 12px;">
                            <label style="display:block; margin-bottom: 4px; font-weight: 600; color: #2c3e50; font-size: 12px;">${argDef.name}</label>`;

            if (isReadOnly) {
                htmlForm += `<input disabled class="swal2-input" style="width: 100%; height: 35px; font-size: 14px; margin: 0; background: #ecf0f1; cursor: not-allowed; color: #7f8c8d;" value="Αυτόματα από τον καμβά">`;
            } else if (i === variantIndex || argDef.name.includes('/')) {
                // Έξυπνο Dropdown! Αν βρει '/' φτιάχνει επιλογές (π.χ. n/p -> 'n' και 'p')
                let options = argDef.name.split('/'); 
                htmlForm += `<select id="swal-input-${i}" class="swal2-input" style="width: 100%; height: 35px; font-size: 14px; margin: 0; padding: 0 10px;">`;
                options.forEach(opt => {
                    let cleanOpt = opt.trim();
                    let selected = (val === cleanOpt || (!val && cleanOpt === options[0].trim())) ? 'selected' : '';
                    htmlForm += `<option value="${cleanOpt}" ${selected}>${cleanOpt}</option>`;
                });
                htmlForm += `</select>`;
            } else {
                // Απλό πεδίο κειμένου
                htmlForm += `<input id="swal-input-${i}" class="swal2-input" style="width: 100%; height: 35px; font-size: 14px; margin: 0; padding: 0 10px;" value="${val}">`;
            }
            htmlForm += `</div>`;
        }
        htmlForm += '</div>';

        Swal.fire({
            title: `<span style="font-size: 18px;">Ιδιότητες: ${data.name}</span>`,
            html: htmlForm,
            showCancelButton: true,
            confirmButtonText: 'Αποθήκευση',
            cancelButtonText: 'Ακύρωση',
            confirmButtonColor: '#27ae60',
			preConfirm: () => {
                let results = { args: [], scale: parseFloat(document.getElementById('swal-input-scale').value) };
                for (let i = 0; i < data.argsCount; i++) {
                    let desc = (data.argNames[i] || { name: '' }).name.toLowerCase();
                    if (desc.includes('position') || desc.includes('rotation')) results.args.push(""); 
                    else results.args.push(document.getElementById(`swal-input-${i}`).value);
                }
                return results;
            }
		}).then((result) => {
            if (result.isConfirmed) {
                let newArgs = result.value.args;
                let newScale = result.value.scale;
                
                el.set('customArgs', newArgs);

                // ΑΛΛΑΓΗ ΤΟΥ ΣΥΜΒΟΛΟΥ ΖΩΝΤΑΝΑ (Variants)
                if (variantIndex !== -1 && data.icons) {
                    let selectedVariant = newArgs[variantIndex];
                    if (data.icons[selectedVariant]) el.attr('icon/d', data.icons[selectedVariant]);
                }

                // ΕΦΑΡΜΟΓΗ ΝΕΟΥ SCALE ΜΕ ΑΠΟΛΥΤΗ ΑΚΡΙΒΕΙΑ
                if (newScale !== currentScale) {
                    applyRobustScale(el, newScale);
                }

				// ΑΛΛΑΓΗ ΤΟΥ ΟΝΟΜΑΤΟΣ Ή ΤΟΥ ΚΕΙΜΕΝΟΥ ΣΤΟΝ ΚΑΜΒΑ
                for (let i = 0; i < data.argsCount; i++) {
                    let desc = (data.argNames[i] || { name: '' }).name.toLowerCase();
                    if (desc === 'name' || desc === 'text') {
						let newName = newArgs[i] === '$NAME$' ? data.name : newArgs[i];
                        updateElementLabel(el, newName);
                    }
                }

                forceExportLatex();
            }
        });
    });

	// --- 11. BI-DIRECTIONAL SYNC (LATEX TO CANVAS) ---

    // Έξυπνος Parser που διαβάζει τα ορίσματα {} και [] χωρίς να μπερδεύεται με φωλιασμένα άγκιστρα!
    function parseLatexArgs(argsStr) {
        let args = [], currentArg = '', depth = 0, inArg = false;
        for (let i = 0; i < argsStr.length; i++) {
            let char = argsStr[i];
            if (char === '{' || char === '[') {
                if (depth === 0) { inArg = true; currentArg = ''; } 
                else { currentArg += char; }
                depth++;
            } else if (char === '}' || char === ']') {
                depth--;
                if (depth === 0) { args.push(currentArg); inArg = false; } 
                else { currentArg += char; }
            } else {
                if (inArg) currentArg += char;
            }
        }
        return args;
    }

    function syncFromLatex() {
        const text = document.getElementById('latex-output').innerText;
        const lines = text.split('\n');

        lines.forEach(line => {
            // Ψάχνουμε γραμμές της μορφής: \macro{...} % id:xxxx
            let match = line.match(/\\([a-zA-Z0-9]+)(.*)% id:([a-zA-Z0-9-]+)/);
            if (match) {
                let macro = match[1].trim();
                let argsStr = match[2].trim();
                let cellId = match[3].trim();

                let cell = graph.getCell(cellId);
                let data = JL_DATABASE[macro];
                if (!cell || !data) return;

                let extractedArgs = parseLatexArgs(argsStr);
                if (extractedArgs.length !== data.argsCount) return;

                let customArgs = cell.get('customArgs') || [];
                let variantIndex = data.variantArg ? data.variantArg - 1 : -1;

                // Ενημερώνουμε τις ιδιότητες (Αγνοούμε τη θέση/περιστροφή για να μην "σπάσει" η δομή στον καμβά)
                for(let i=0; i<data.argsCount; i++) {
                    let desc = (data.argNames[i] || { name: '' }).name.toLowerCase();
                    if (!desc.includes('position') && !desc.includes('rotation')) {
                        customArgs[i] = extractedArgs[i];
                        
                        // 1. Ενημέρωση του Variant (π.χ. n -> p)
                        if (i === variantIndex && data.icons[extractedArgs[i]]) {
                            cell.attr('icon/d', data.icons[extractedArgs[i]]);
                        }
                        
                        // 2. Ενημέρωση του Ονόματος ή του Κειμένου στον Καμβά
                        if (desc === 'name' || desc === 'text') {
							let newName = extractedArgs[i] === '$NAME$' ? data.name : extractedArgs[i];
							updateElementLabel(cell, newName);
                        }
                    }
                }
                cell.set('customArgs', customArgs);
            }
        });

        // Αφού συγχρονίσαμε τον καμβά, ξαναχτίζουμε τον κώδικα για να τον "καθαρίσουμε" 
        // (και να εφαρμόσουμε τυχόν αλλαγές που έγιναν)
        latexEdited = false; 
        forceExportLatex(); 
        
		Swal.fire({
            toast: true,
            position: 'bottom-end',
            icon: 'success',
            title: 'Συγχρονίστηκε!',
            text: 'Ο καμβάς ενημερώθηκε.',
            showConfirmButton: false,
            timer: 2000,
            timerProgressBar: true,
            background: '#f8f9fa',
            color: '#2c3e50'
        });
    }
	
	let showPinNames = true;

	$('#toggle-pin-names').change(function() {
		showPinNames = this.checked;
		// Ενημέρωση όλων των υπαρχόντων εξαρτημάτων στο γράφημα
		graph.getElements().forEach(el => {
			if (el.get('latexMacro') === 'connectordot') return;
			const ports = el.getPorts();
			ports.forEach(port => {
				el.portProp(port.id, 'attrs/portLabel/display', showPinNames ? 'block' : 'none');
			});
		});
	});
</script>
