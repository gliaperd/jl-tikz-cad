    // --- ADVANCED SVG EXPORT (WITH FILTERS) ---
    function downloadAdvancedSVG(options) {
        const bbox = paper.getContentBBox();
        if (!bbox || bbox.width === 0 || bbox.height === 0) {
            Swal.fire({ icon: 'info', title: 'Empty Canvas', text: 'There is nothing to export.'});
            return;
        }

        // --- BULLETPROOF HIGHLIGHT REMOVAL ---
        // 1. Save current selection to memory
        const savedSelectedElements = [...selectedElements];
        const savedSelectedLinks = [...selectedLinks];
        // 2. Clear selection on the actual canvas so highlights are destroyed natively by JointJS
        clearSelection();

        const padding = 25;
        const x = bbox.x - padding;
        const y = bbox.y - padding;
        const width = bbox.width + padding * 2;
        const height = bbox.height + padding * 2;

        // Clone the clean, selection-free SVG
        const svgNode = paper.svg.cloneNode(true);
        const viewport = svgNode.querySelector('.viewport');
        if (viewport) viewport.removeAttribute('transform');

        svgNode.setAttribute('viewBox', `${x} ${y} ${width} ${height}`);
        svgNode.setAttribute('width', width);
        svgNode.setAttribute('height', height);

        // 3. Restore the selection silently for the user
        savedSelectedElements.forEach(el => { 
            selectedElements.push(el); 
            const v = paper.findViewByModel(el); 
            if(v) v.highlight(); 
        });
        savedSelectedLinks.forEach(l => { 
            selectedLinks.push(l); 
            const v = paper.findViewByModel(l); 
            if(v) v.highlight(); 
        });
        // -------------------------------------

        // A. Apply Custom Wire Thickness
        svgNode.querySelectorAll('path[joint-selector="line"]').forEach(n => {
            n.setAttribute('stroke-width', options.wireWidth);
			// --- NEW: Professional rounded corners and endpoints ---
				n.setAttribute('stroke-linejoin', 'round');
				n.setAttribute('stroke-linecap', 'round');
        });

        // -- APPLY VISUAL FILTERS --

        // 1. Free Text
        if (!options.freetext) {
            graph.getElements().filter(e => e.get('latexMacro') === 'freetext').forEach(e => {
                let node = svgNode.querySelector(`[model-id="${e.id}"]`);
                if (node) node.remove();
            });
        }

        // 2. Component Names (Label and KaTeX foreignObject)
        if (!options.compnames) {
            graph.getElements().filter(e => e.get('latexMacro') !== 'freetext' && e.get('latexMacro') !== 'connectordot').forEach(e => {
                let node = svgNode.querySelector(`[model-id="${e.id}"]`);
                if (node) {
                    let label = node.querySelector('text[joint-selector="label"]');
                    if (label) label.remove();
                    let fo = node.querySelector('foreignObject');
                    if (fo) fo.remove();
                }
            });
        }

        // 3. Pins (Orange Boxes)
        if (!options.pins) {
            svgNode.querySelectorAll('[joint-selector="portBody"]').forEach(n => n.remove());
        }

        // 4. Pin Names
        if (!options.pinnames) {
            svgNode.querySelectorAll('[joint-selector="portLabel"]').forEach(n => n.remove());
        }

        // 5. Monochrome (Black & White)
        if (options.mono) {
            svgNode.querySelectorAll('*').forEach(n => {
                let stroke = n.getAttribute('stroke');
                let fill = n.getAttribute('fill');
                
                if (stroke && stroke !== 'none' && stroke !== 'transparent') n.setAttribute('stroke', '#000000');
                
                if (fill && fill !== 'none' && fill !== 'transparent' && fill.toLowerCase() !== '#ffffff' && n.getAttribute('fill-opacity') !== '0.01') {
                    n.setAttribute('fill', '#000000');
                }
                
                if (n.tagName === 'div' || n.tagName === 'span') n.style.color = '#000000'; 
            });
        }

        // 6. Grid
        if (options.grid) {
            let defs = svgNode.querySelector('defs') || document.createElementNS("http://www.w3.org/2000/svg", "defs");
            if (!svgNode.querySelector('defs')) svgNode.prepend(defs);
            
            let pattern = document.createElementNS("http://www.w3.org/2000/svg", "pattern");
            pattern.setAttribute("id", "exportGrid");
            pattern.setAttribute("width", "40");
            pattern.setAttribute("height", "40");
            pattern.setAttribute("patternUnits", "userSpaceOnUse");
            
            let circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", "0");
            circle.setAttribute("cy", "0");
            circle.setAttribute("r", "1.5");
            circle.setAttribute("fill", options.mono ? "#cccccc" : "#bdc3c7"); 
            
            pattern.appendChild(circle);
            defs.appendChild(pattern);
            
            let gridRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            gridRect.setAttribute("x", x);
            gridRect.setAttribute("y", y);
            gridRect.setAttribute("width", width);
            gridRect.setAttribute("height", height);
            gridRect.setAttribute("fill", "url(#exportGrid)");
            
            svgNode.insertBefore(gridRect, viewport); 
        }

        // -- FINALIZE AND DOWNLOAD --
        let svgString = new XMLSerializer().serializeToString(svgNode);
        if (!svgString.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
            svgString = svgString.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
        }
        
        saveFileAs(svgString, 'circuit.svg', 'image/svg+xml', 'SVG Vector Graphic');
    }
	
    function importProject(e) { 
        const f = e.target.files[0]; 
        if(!f) return; 
        
        const r = new FileReader(); 
        r.onload = ev => {
            graph.fromJSON(JSON.parse(ev.target.result)); 
            zoomFit(); 
            clearSelection(); 
            
			const savedLatex = graph.get('customLatex');
            if (savedLatex) {
                window.rawLatexCode = savedLatex;
                const highlighted = savedLatex.split('\n').map(line => highlightLatex(escapeHTML(line))).join('\n');
                document.getElementById('latex-output').innerHTML = highlighted;
                latexEdited = true;
            } else {
                forceExportLatex();
            }
        }; 
        r.readAsText(f); 
        e.target.value = ''; // Μηδενισμός του input για να μπορούμε να ξαναφορτώσουμε το ίδιο αρχείο αν χρειαστεί
    }

	function runLinterUI(onSuccessCallback = null) {
        let rawText = document.getElementById('latex-output').innerText;
        
        // ΚΑΘΑΡΙΣΜΟΣ ΤΩΝ IDs ΠΡΙΝ ΤΟΝ ΕΛΕΓΧΟ / COPY / DOWNLOAD!
        // Βρίσκει οτιδήποτε ξεκινάει με "% id:" και το εξαφανίζει.
        let cleanText = rawText.replace(/ % id:[a-zA-Z0-9-]+/g, '');
        
        const errors = validateLatexSyntax(cleanText);
        
        if (errors.length === 0) {
            if (onSuccessCallback) {
                onSuccessCallback(cleanText); // Στέλνει τον ΚΑΘΑΡΟ κώδικα!
            } else {
                Swal.fire({
                    icon: 'success',
                    title: 'LaTeX code OK!',
                    text: 'No errors found.',
                    timer: 1500,
                    showConfirmButton: false
                });
            }
        } else {
            // Αν βρέθηκαν λάθη, δείξε τη λίστα! (Το υπόλοιπο της συνάρτησης μένει ίδιο)
            const errorHtml = `<ul style="text-align: left; font-size: 14px; color: #c0392b; background: #fad390; padding: 15px; border-radius: 5px;">` + 
                              errors.map(e => `<li style="margin-bottom: 8px;">${e}</li>`).join('') + 
                              `</ul>`;
            
            Swal.fire({
                icon: 'error',
                title: 'Errors found',
                html: errorHtml,
                showCancelButton: onSuccessCallback ? true : false,
                confirmButtonText: onSuccessCallback ? "Ignore & Continue" : "OK, I'll fix them",
                cancelButtonText: 'Cancel',
                confirmButtonColor: '#e74c3c'
            }).then((result) => {
                if (result.isConfirmed && onSuccessCallback) {
                    onSuccessCallback(cleanText); // Και εδώ στέλνει τον καθαρό!
                }
            });
        }
    }

    function copyLatexToClipboard() {
        // Τώρα, πριν κάνει copy, τρέχει τον Linter!
        runLinterUI((textToCopy) => {
            navigator.clipboard.writeText(textToCopy).then(() => {
                Swal.fire({ icon: 'success', title: 'Copied!', timer: 1000, showConfirmButton: false });
            });
        });
    }

	
	// --- 9. LATEX LINTER (ΣΥΝΤΑΚΤΙΚΟΣ ΕΛΕΓΧΟΣ) ---
    function validateLatexSyntax(text) {
        let errors = [];
        
        // 1. Έλεγχος Συνολικής Ισορροπίας Αγκυλών { }
        let openBraces = (text.match(/\{/g) || []).length;
        let closeBraces = (text.match(/\}/g) || []).length;
        if (openBraces !== closeBraces) {
            errors.push(`<b>Ανισορροπία Αγκυλών:</b> Βρέθηκαν ${openBraces} ανοιχτές <code>{</code> και ${closeBraces} κλειστές <code>}</code>.`);
        }
        
        // Λίστα με τις στάνταρ εντολές του TikZ που επιτρέπουμε
        const knownSystemMacros = ['begin', 'end', 'draw', 'tikzpictureJL', 'connectordot', 'setscale'];
        const macroRegex = /\\([a-zA-Z]+)/g;
        let match;
        
        // Σαρώνουμε όλο το κείμενο για εντολές που ξεκινάνε με \
        while ((match = macroRegex.exec(text)) !== null) {
            const macroName = match[1];
            const macroIndex = match.index;
            
            // 2. Έλεγχος αν η εντολή υπάρχει
            if (!knownSystemMacros.includes(macroName) && (!JL_DATABASE || !JL_DATABASE[macroName])) {
                errors.push(`<b>Άγνωστη εντολή:</b> <code>\\${macroName}</code>. Μήπως υπάρχει τυπογραφικό λάθος;`);
                continue;
            }
            
            // 3. Έλεγχος Ορισμάτων (μόνο για τα εξαρτήματα της βάσης μας)
            if (JL_DATABASE && JL_DATABASE[macroName]) {
                const expectedArgs = JL_DATABASE[macroName].argsCount || 7;
                let argCount = 0;
                let i = macroIndex + match[0].length;
                
                // Σαρώνουμε γραμμικά για να πιάσουμε σωστά τα φωλιασμένα {} και []
                while (i < text.length) {
                    let char = text[i];
                    
                    // Αγνοούμε τα κενά ανάμεσα στα ορίσματα
                    if (char === ' ' || char === '\n' || char === '\r' || char === '\t') { i++; continue; }
                    
                    if (char === '{' || char === '[') {
                        argCount++;
                        let openChar = char;
                        let closeChar = char === '{' ? '}' : ']';
                        let depth = 1;
                        i++;
                        // Προχωράμε μέχρι να κλείσει το τρέχον όρισμα (ακόμα κι αν έχει μέσα άλλα {})
                        while (i < text.length && depth > 0) {
                            if (text[i] === openChar) depth++;
                            else if (text[i] === closeChar) depth--;
                            i++;
                        }
                    } else {
                        // Βρήκαμε κάτι άλλο (π.χ. κανονικό κείμενο ή νέα εντολή), άρα σταματάμε το μέτρημα για αυτή την εντολή
                        break;
                    }
                }
                
                if (argCount !== expectedArgs) {
                    errors.push(`<b>Λάθος αριθμός ορισμάτων στην εντολή <code>\\${macroName}</code>:</b><br>Βρέθηκαν ${argCount}, ενώ η βιβλιοθήκη απαιτεί ${expectedArgs}.`);
                }
            }
        }
        
        return errors;
    }
	
	// --- 10. PROPERTY EDITOR (ΔΙΠΛΟ ΚΛΙΚ) ---
    paper.on('cell:pointerdblclick', function(cellView) {
        let el = cellView.model;
        if (el.isLink() || el.get('latexMacro') === 'connectordot') return;

        let macro = el.get('latexMacro');
        let data = JL_DATABASE[macro];
        if (!data) return;

        let currentArgs = el.get('customArgs') || [];
        let htmlForm = '<div style="text-align: left; font-size: 14px;">';

        // Το variant_arg έρχεται ως 1-based, εμείς το θέλουμε 0-based για τα arrays
        let variantIndex = data.variantArg ? data.variantArg - 1 : -1;
		
		let currentScale = el.get('customScale') || 1;

        // --- ΔΥΝΑΜΙΚΑ SCALE FACTORS ΑΝΑ ΕΞΑΡΤΗΜΑ ---
        // Αν το εξάρτημα έχει ορισμένα scales στη βάση (data.scales), χρησιμοποιούμε αυτά.
        // Αλλιώς, επιτρέπουμε την πλήρη σειρά (0.5, 1, 2, 4).
        let allowedScales = data.scales || [0.5, 1, 2, 4];
        
        let scaleOptionsHtml = allowedScales.map(val => {
            let isSelected = (currentScale === val) ? 'selected' : '';
            return `<option value="${val}" ${isSelected}>${val}x</option>`;
        }).join('\n');

        htmlForm += `<div style="margin-bottom: 12px; border-bottom: 1px solid #ccc; padding-bottom: 10px;">
                        <label style="display:block; margin-bottom: 4px; font-weight: 600; color: #2c3e50; font-size: 12px;">Κλίμακα / Scale (TikZ)</label>
                        <select id="swal-input-scale" class="swal2-input" style="width: 100%; height: 35px; font-size: 14px; margin: 0; padding: 0 10px;">
                            ${scaleOptionsHtml}
                        </select>
                    </div>`;

		for (let i = 0; i < data.argsCount; i++) {
            let argDef = data.argNames[i] || { name: `Arg ${i+1}` };
            let desc = argDef.name.toLowerCase();
            let val = currentArgs[i] !== undefined ? currentArgs[i] : "";

            // --- ΝΕΟ: Αν είναι το Name/Text και είναι κενό, τράβα το όνομα που βλέπουμε! ---
            if (val === "" && (desc === 'name' || desc === 'text')) {
                val = el.get('displayedText') || data.name;
            }

            // Κλειδώνουμε τη Θέση και την Περιστροφή (υπολογίζονται αυτόματα)
            let isReadOnly = desc.includes('position') || desc.includes('rotation');
            
            htmlForm += `<div style="margin-bottom: 12px;">
                            <label style="display:block; margin-bottom: 4px; font-weight: 600; color: #2c3e50; font-size: 12px;">${argDef.name}</label>`;

            if (isReadOnly) {
                htmlForm += `<input disabled class="swal2-input" style="width: 100%; height: 35px; font-size: 14px; margin: 0; background: #ecf0f1; cursor: not-allowed; color: #7f8c8d;" value="Auto from canvas">`;
            } else if (i === variantIndex || argDef.name.includes('/')) {
                // Έξυπνο Dropdown! Αν βρει '/' φτιάχνει επιλογές (π.χ. n/p -> 'n' και 'p')
                let options = argDef.name.split('/'); 
                htmlForm += `<select id="swal-input-${i}" class="swal2-input" style="width: 100%; height: 35px; font-size: 14px; margin: 0; padding: 0 10px;">`;
                options.forEach(opt => {
                    let cleanOpt = opt.trim();
                    let selected = (val === cleanOpt || (!val && cleanOpt === options[0].trim())) ? 'selected' : '';
                    htmlForm += `<option value="${cleanOpt}" ${selected}>${cleanOpt}</option>`;
                });
                htmlForm += `</select>`;
            } else {
                // Απλό πεδίο κειμένου
                htmlForm += `<input id="swal-input-${i}" class="swal2-input" style="width: 100%; height: 35px; font-size: 14px; margin: 0; padding: 0 10px;" value="${val}">`;
            }
            htmlForm += `</div>`;
        }
        htmlForm += '</div>';

        Swal.fire({
            title: `<span style="font-size: 18px;">Ιδιότητες: ${data.name}</span>`,
            html: htmlForm,
            showCancelButton: true,
            confirmButtonText: 'Αποθήκευση',
            cancelButtonText: 'Ακύρωση',
            confirmButtonColor: '#27ae60',
			preConfirm: () => {
                let results = { args: [], scale: parseFloat(document.getElementById('swal-input-scale').value) };
                for (let i = 0; i < data.argsCount; i++) {
                    let desc = (data.argNames[i] || { name: '' }).name.toLowerCase();
                    if (desc.includes('position') || desc.includes('rotation')) results.args.push(""); 
                    else results.args.push(document.getElementById(`swal-input-${i}`).value);
                }
                return results;
            }
		}).then((result) => {
            if (result.isConfirmed) {
                let newArgs = result.value.args;
                let newScale = result.value.scale;
                
                el.set('customArgs', newArgs);

                // ΑΛΛΑΓΗ ΤΟΥ ΣΥΜΒΟΛΟΥ ΖΩΝΤΑΝΑ (Variants)
                if (variantIndex !== -1 && data.icons) {
                    let selectedVariant = newArgs[variantIndex];
                    if (data.icons[selectedVariant]) el.attr('icon/d', data.icons[selectedVariant]);
                }

                // ΕΦΑΡΜΟΓΗ ΝΕΟΥ SCALE ΜΕ ΑΠΟΛΥΤΗ ΑΚΡΙΒΕΙΑ
                if (newScale !== currentScale) {
                    applyRobustScale(el, newScale);
                }

				// ΑΛΛΑΓΗ ΤΟΥ ΟΝΟΜΑΤΟΣ Ή ΤΟΥ ΚΕΙΜΕΝΟΥ ΣΤΟΝ ΚΑΜΒΑ
                for (let i = 0; i < data.argsCount; i++) {
                    let desc = (data.argNames[i] || { name: '' }).name.toLowerCase();
                    if (desc === 'name' || desc === 'text') {
						let newName = newArgs[i] === '$NAME$' ? data.name : newArgs[i];
                        updateElementLabel(el, newName);
                    }
                }

                forceExportLatex();
            }
        });
    });

	// --- 11. BI-DIRECTIONAL SYNC (LATEX TO CANVAS) ---

    // Έξυπνος Parser που διαβάζει τα ορίσματα {} και [] χωρίς να μπερδεύεται με φωλιασμένα άγκιστρα!
    function parseLatexArgs(argsStr) {
        let args = [], currentArg = '', depth = 0, inArg = false;
        for (let i = 0; i < argsStr.length; i++) {
            let char = argsStr[i];
            if (char === '{' || char === '[') {
                if (depth === 0) { inArg = true; currentArg = ''; } 
                else { currentArg += char; }
                depth++;
            } else if (char === '}' || char === ']') {
                depth--;
                if (depth === 0) { args.push(currentArg); inArg = false; } 
                else { currentArg += char; }
            } else {
                if (inArg) currentArg += char;
            }
        }
        return args;
    }

    function syncFromLatex() {
        const text = document.getElementById('latex-output').innerText;
        const lines = text.split('\n');

        lines.forEach(line => {
            // Ψάχνουμε γραμμές της μορφής: \macro{...} % id:xxxx
            let match = line.match(/\\([a-zA-Z0-9]+)(.*)% id:([a-zA-Z0-9-]+)/);
            if (match) {
                let macro = match[1].trim();
                let argsStr = match[2].trim();
                let cellId = match[3].trim();

                let cell = graph.getCell(cellId);
                let data = JL_DATABASE[macro];
                if (!cell || !data) return;

                let extractedArgs = parseLatexArgs(argsStr);
                if (extractedArgs.length !== data.argsCount) return;

                let customArgs = cell.get('customArgs') || [];
                let variantIndex = data.variantArg ? data.variantArg - 1 : -1;

                // Ενημερώνουμε τις ιδιότητες (Αγνοούμε τη θέση/περιστροφή για να μην "σπάσει" η δομή στον καμβά)
                for(let i=0; i<data.argsCount; i++) {
                    let desc = (data.argNames[i] || { name: '' }).name.toLowerCase();
                    if (!desc.includes('position') && !desc.includes('rotation')) {
                        customArgs[i] = extractedArgs[i];
                        
                        // 1. Ενημέρωση του Variant (π.χ. n -> p)
                        if (i === variantIndex && data.icons[extractedArgs[i]]) {
                            cell.attr('icon/d', data.icons[extractedArgs[i]]);
                        }
                        
                        // 2. Ενημέρωση του Ονόματος ή του Κειμένου στον Καμβά
                        if (desc === 'name' || desc === 'text') {
							let newName = extractedArgs[i] === '$NAME$' ? data.name : extractedArgs[i];
							updateElementLabel(cell, newName);
                        }
                    }
                }
                cell.set('customArgs', customArgs);
            }
        });

        // Αφού συγχρονίσαμε τον καμβά, ξαναχτίζουμε τον κώδικα για να τον "καθαρίσουμε" 
        // (και να εφαρμόσουμε τυχόν αλλαγές που έγιναν)
        latexEdited = false; 
        forceExportLatex(); 
        
		Swal.fire({
            toast: true,
            position: 'bottom-end',
            icon: 'success',
            title: 'Synced!',
            text: 'Canvas updated.',
            showConfirmButton: false,
            timer: 2000,
            timerProgressBar: true,
            background: '#f8f9fa',
            color: '#2c3e50'
        });
    }
	
	let showPinNames = true;

	$('#toggle-pin-names').change(function() {
		showPinNames = this.checked;
		// Ενημέρωση όλων των υπαρχόντων εξαρτημάτων στο γράφημα
		graph.getElements().forEach(el => {
			if (el.get('latexMacro') === 'connectordot') return;
			const ports = el.getPorts();
			ports.forEach(port => {
				el.portProp(port.id, 'attrs/portLabel/display', showPinNames ? 'block' : 'none');
			});
		});
	});
</script>
