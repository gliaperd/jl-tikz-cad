<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JL TikZ CAD 2.0</title>
    
    <!-- External Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jointjs/3.7.0/joint.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    
    <!-- Our Clean CSS -->
    <link rel="stylesheet" href="css/styles.css">
	
	<!-- Professional Typography Stack -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
	
	<!-- Add Lucide Icons -->
	<script src="https://unpkg.com/lucide@latest"></script>

    <!-- UI Icon Alignment Patch -->
    <style>
        .lucide { width: 16px; height: 16px; }
        .tool-btn, .menu-item, .min-tab { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .toolbar-dropdown-content label { display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

<div id="toolbar">
    <!-- Notice there is NO space between </i> and the text now! -->
    <button id="tool-pan" class="tool-btn active"><i data-lucide="mouse-pointer-2"></i>Select</button>
    <button id="tool-draw" class="tool-btn"><i data-lucide="pencil"></i>Wire</button>
    <div class="v-separator"></div>
    
    <button id="btn-copy" class="tool-btn"><i data-lucide="copy"></i>Copy</button>
    <button id="btn-paste" class="tool-btn"><i data-lucide="clipboard-paste"></i>Paste</button>
    <button id="btn-delete" class="tool-btn"><i data-lucide="trash-2"></i>Delete</button>
    <button id="btn-rotate" class="tool-btn"><i data-lucide="rotate-cw"></i>Rotate</button>
    <button id="btn-flip-h" class="tool-btn"><i data-lucide="flip-horizontal"></i>Flip H</button>
    <button id="btn-flip-v" class="tool-btn"><i data-lucide="flip-vertical"></i>Flip V</button>
    
    <div class="toolbar-dropdown">
        <button class="tool-btn"><i data-lucide="eye"></i>View ▼</button>
        <div class="toolbar-dropdown-content">
            <label><input type="checkbox" id="toggle-pins" checked> <i data-lucide="map-pin" style="width: 14px; height: 14px;"></i>Pins</label>
            <label><input type="checkbox" id="toggle-pin-names" checked> <i data-lucide="tag" style="width: 14px; height: 14px;"></i>Pin Names</label>
            <label><input type="checkbox" id="chkShowNets"> <i data-lucide="zap" style="width: 14px; height: 14px;"></i>Net Names</label>
            <label><input type="checkbox" id="toggle-ghost-dots" checked> <i data-lucide="ghost" style="width: 14px; height: 14px;"></i>Ghost Dots</label>
        </div>
    </div>
    
    <div class="v-separator"></div>
    <button id="btn-fit" class="tool-btn" style="font-weight:bold;"><i data-lucide="maximize"></i>Fit</button>
    <span id="zoom-level" style="font-size: 11px; min-width: 40px; text-align:center;">100%</span>

    <div class="v-separator"></div>
    <button id="btn-undo" class="tool-btn"><i data-lucide="undo"></i>Undo</button>
    <button id="btn-redo" class="tool-btn"><i data-lucide="redo"></i>Redo</button>
    <button id="btn-clear" class="tool-btn"><i data-lucide="trash"></i>Clear</button> 
    
    <div class="v-separator"></div>
    
    <div class="toolbar-dropdown">
        <button class="tool-btn" style="font-weight:bold;"><i data-lucide="zap"></i>Simulate ▼</button>
        <div class="toolbar-dropdown-content" style="min-width: 190px;">
            <div class="menu-item" id="btn-sim-op"><i data-lucide="zap"></i>DC Operating Point</div>
            <div class="menu-item" id="btn-sim-tran"><i data-lucide="activity"></i>Transient Analysis</div>
            <div class="menu-item" id="btn-sim-ac"><i data-lucide="waves"></i>AC Analysis</div>
            <div class="menu-item" id="btn-sim-netlist"><i data-lucide="file-code"></i>View/Edit Netlist</div>
            <div class="menu-item" id="btn-sim-logic"><i data-lucide="clock"></i>Digital Timing Analysis</div>
            <div style="border-top: 1px solid #ecf0f1; margin: 4px 0;"></div>
            <div class="menu-item" id="btn-sim-settings"><i data-lucide="settings"></i>Simulation Settings</div>
            <div class="menu-item" id="btn-sim-clear"><i data-lucide="eraser"></i>Clear Annotations</div>
            <div class="menu-item" id="btn-sim-thevenin"><i data-lucide="wand-2"></i>Thevenin/Norton Eq.</div>
			<div class="menu-item" id="btn-sim-xferfnc"><i data-lucide="square-function"></i>SPICE Transfer Function (DC)</div>
        </div>
    </div>
    
    <div class="v-separator"></div>
    
    <button id="btn-save" class="tool-btn"><i data-lucide="save"></i>Save</button>
    <button id="btn-open" class="tool-btn"><i data-lucide="folder-open"></i>Open</button>
    <input type="file" id="importFile" style="display:none" accept=".json,.tex,.txt" multiple>
	<button id="btn-pack" class="tool-btn"><i data-lucide="package"></i>Pack</button>
    
    <div class="v-separator"></div>
    
    <label style="color:white; font-size:12px; display:flex; align-items:center; gap:5px; cursor:pointer; user-select:none; margin-left: 8px;">
        Theme:
        <select id="theme-selector" style="background:var(--bg-btn); color:white; border:none; border-radius:4px; font-size:12px; padding: 2px 6px; outline: none;">
            <option value="standard" selected>Standard</option>
            <option value="cadence">Cadence</option>
        </select>
    </label>
    
    <div style="margin-left:auto; display:flex; gap:8px;">
        <!-- NEW OUTPUT TOGGLE BUTTON -->
        <button id="btn-toggle-output" class="tool-btn"><i data-lucide="code"></i>TikZ Code</button>
        <button id="btn-export-dialog" class="tool-btn" style="font-weight: bold; background: var(--primary);"><i data-lucide="download"></i>Export</button>
    </div>
</div>

<div id="main">
    <div id="paper-container" tabindex="0">
        <div id="draw-glasspane"></div>
        <div id="my-paper"></div>
    </div>
    
    <!-- RESTRUCTURED SIDEBAR -->
    <div id="sidebar">
        <!-- Persistent Vertical Toggle -->
        <div id="sidebar-toggle" title="Toggle Components Palette">
            <i data-lucide="palette"></i>COMPONENTS
        </div>
        
        <!-- Expandable Content -->
        <div id="sidebar-content">
            <div style="padding: 10px; border-bottom: 1px solid var(--border-main); background: var(--bg-panel); flex-shrink: 0;">
                <input type="text" id="palette-search" placeholder="Search parts..." style="width: 100%; padding: 6px 10px; box-sizing: border-box; border: 1px solid var(--border-main); border-radius: 4px; font-size: 12px; outline: none;">
            </div>
            <div id="items-container"></div>
        </div>
    </div>
</div>

<div id="output-panel" class="collapsed">
    <div class="floating-buttons">
        <!-- Removed the minimize button from here -->
        <button id="btn-sync-latex" class="tool-btn" style="font-size: 11px;"><i data-lucide="refresh-cw" style="width: 14px; height: 14px;"></i>Sync</button>
        <button id="btn-check-syntax" class="tool-btn" style="font-size: 11px;"><i data-lucide="check-circle" style="width: 14px; height: 14px;"></i>Check Syntax</button>
        <button id="btn-copy-latex" class="tool-btn" style="font-size: 11px;"><i data-lucide="copy" style="width: 14px; height: 14px;"></i>Copy</button>
    </div>
    <div id="latex-output" contenteditable="true" spellcheck="false"></div>
</div>

<!-- REMOVED THE minimized-corner DIV COMPLETELY -->

<!-- External Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/backbone.js/1.4.1/backbone-min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jointjs/3.7.0/joint.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

<!-- The Internal Database & Engine -->
<script src="db/components_db.js"></script>
<script src="simulation/ngspice_v4.js"></script>

<!-- The Entry Point -->
<script type="module" src="js/app.js"></script>

<!-- TEMPLATES FOR DIALOGS -->
<template id="tpl-export-dialog">
    <div style="text-align: left; font-size: 13px; color: var(--text-main);">
        <div style="margin-bottom: 15px;">
            <label style="font-weight: 600; margin-bottom: 6px; display: block;">File Format:</label>
            <select id="export-format" style="width: 100%; height: 35px; font-size: 13px; outline: none; border: 1px solid var(--border-main); border-radius: 4px; padding: 4px; background: var(--bg-panel); color: var(--text-main);">
                <option value="svg">SVG (Vector Graphic)</option>
                <option value="tikz">TikZ Code Snippet (.tex)</option>
                <option value="standalone">Standalone LaTeX (.tex)</option>
                <option value="spice">SPICE Netlist (.cir)</option>
            </select>
        </div>
        
        <div id="svg-options-container" style="display: block;">
            <div style="margin-top: 10px; padding: 10px; background: var(--bg-app); border: 1px solid var(--border-main); border-radius: 4px; font-size: 11px; color: var(--text-muted); margin-bottom: 15px;">
                <i data-lucide="info" style="width: 14px; height: 14px; vertical-align: middle; margin-right: 4px;"></i> <b>Note:</b> Math (KaTeX) is exported as HTML elements. Vector editors like Inkscape will not display them. For print quality, prefer <b>Standalone LaTeX</b>.
            </div>
            
            <div style="margin-bottom: 8px; font-weight: 600;">Visual Options (SVG Only):</div>
            <div style="background: var(--bg-app); border: 1px solid var(--border-main); padding: 12px; border-radius: 6px;">
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer; margin-bottom: 8px;">
                    <input type="checkbox" id="exp-grid"> Show Canvas Grid
                </label>
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer; margin-bottom: 8px;">
                    <input type="checkbox" id="exp-pins"> Show Component Pins 
                </label>
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer; margin-bottom: 8px;">
                    <input type="checkbox" id="exp-pinnames" checked> Show Pin Names
                </label>
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer; margin-bottom: 8px;">
                    <input type="checkbox" id="exp-compnames" checked> Show Component Names
                </label>
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer; margin-bottom: 8px;">
                    <input type="checkbox" id="exp-freetext" checked> Show Free Text Labels
                </label>
                
                <hr style="border-top: 1px solid var(--border-main); margin: 12px 0;">
                
                <div style="margin-bottom: 15px;">
                    <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <label style="font-weight: 600;">Global Line Weight:</label>
                        <span id="weight-val" style="font-weight: bold; color: var(--text-main);">100%</span>
                    </div>
                    <input type="range" id="exp-weight-scale" min="0.5" max="3" step="0.1" value="1" style="width: 100%; cursor: ew-resize;">
                </div>

                <hr style="border-top: 1px solid var(--border-main); margin: 12px 0;">
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer; color: var(--text-main); font-weight: 600;">
                    <input type="checkbox" id="exp-mono"> Monochrome (Black &amp; White)
                </label>
            </div>
        </div>
    </div>
</template>

<!-- SIMULATION SETTINGS TEMPLATE -->
<template id="tpl-sim-settings">
    <div style="text-align:left; font-size:13px; color:var(--text-main);">
        <!-- Changed to CSS Grid to strictly enforce 50/50 columns -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
            
            <!-- TRANSIENT -->
            <div style="padding: 12px; border: 1px solid var(--border-main); border-radius: 6px; background: var(--bg-app); min-width: 0;">
                <div style="font-weight: 600; color: var(--text-main); margin-bottom: 10px; font-size: 12px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--border-main); padding-bottom: 6px;">
                    <i data-lucide="activity" style="width: 14px; height: 14px;"></i> Transient (.tran)
                </div>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <div style="display:flex; align-items:center; gap:5px;"><label style="width:55px; font-size:11px; font-weight:600; color:var(--text-muted);">Step</label><input type="text" id="sim-tran-step" style="flex:1; min-width: 0; padding:4px 6px; font-size:12px; box-sizing:border-box; border:1px solid var(--border-main); border-radius:3px; outline: none; background: var(--bg-panel); color: var(--text-main);"></div>
                    <div style="display:flex; align-items:center; gap:5px;"><label style="width:55px; font-size:11px; font-weight:600; color:var(--text-muted);">Stop</label><input type="text" id="sim-tran-stop" style="flex:1; min-width: 0; padding:4px 6px; font-size:12px; box-sizing:border-box; border:1px solid var(--border-main); border-radius:3px; outline: none; background: var(--bg-panel); color: var(--text-main);"></div>
                    <div style="display:flex; align-items:center; gap:5px;"><label style="width:55px; font-size:11px; font-weight:600; color:var(--text-muted);">Start</label><input type="text" id="sim-tran-start" style="flex:1; min-width: 0; padding:4px 6px; font-size:12px; box-sizing:border-box; border:1px solid var(--border-main); border-radius:3px; outline: none; background: var(--bg-panel); color: var(--text-main);"></div>
                </div>
            </div>

            <!-- AC SWEEP -->
            <div style="padding: 12px; border: 1px solid var(--border-main); border-radius: 6px; background: var(--bg-app); min-width: 0;">
                <div style="font-weight: 600; color: var(--text-main); margin-bottom: 10px; font-size: 12px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--border-main); padding-bottom: 6px;">
                    <i data-lucide="waves" style="width: 14px; height: 14px;"></i> AC Sweep (.ac)
                </div>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <div style="display:flex; align-items:center; gap:5px;"><label style="width:55px; font-size:11px; font-weight:600; color:var(--text-muted);">Type</label>
                        <select id="sim-ac-type" style="flex:1; min-width: 0; padding:4px 6px; font-size:12px; box-sizing:border-box; border:1px solid var(--border-main); border-radius:3px; outline: none; background: var(--bg-panel); color: var(--text-main);">
                            <option value="dec">Decade</option>
                            <option value="oct">Octave</option>
                            <option value="lin">Linear</option>
                        </select>
                    </div>
                    <div style="display:flex; align-items:center; gap:5px;"><label style="width:55px; font-size:11px; font-weight:600; color:var(--text-muted);">Points</label><input type="text" id="sim-ac-pts" style="flex:1; min-width: 0; padding:4px 6px; font-size:12px; box-sizing:border-box; border:1px solid var(--border-main); border-radius:3px; outline: none; background: var(--bg-panel); color: var(--text-main);"></div>
                    <div style="display:flex; align-items:center; gap:5px;"><label style="width:55px; font-size:11px; font-weight:600; color:var(--text-muted);">Start</label><input type="text" id="sim-ac-start" style="flex:1; min-width: 0; padding:4px 6px; font-size:12px; box-sizing:border-box; border:1px solid var(--border-main); border-radius:3px; outline: none; background: var(--bg-panel); color: var(--text-main);"></div>
                    <div style="display:flex; align-items:center; gap:5px;"><label style="width:55px; font-size:11px; font-weight:600; color:var(--text-muted);">Stop</label><input type="text" id="sim-ac-stop" style="flex:1; min-width: 0; padding:4px 6px; font-size:12px; box-sizing:border-box; border:1px solid var(--border-main); border-radius:3px; outline: none; background: var(--bg-panel); color: var(--text-main);"></div>
                </div>
            </div>
        </div>

        <!-- SPICE MODELS -->
        <div style="margin-bottom: 15px; padding: 12px; border: 1px solid var(--border-main); border-radius: 6px; background: var(--bg-app);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid var(--border-main); padding-bottom: 6px;">
                <div style="font-weight: 600; color: var(--text-main); font-size: 12px; display: flex; align-items: center; gap: 6px;">
                    <i data-lucide="library" style="width: 14px; height: 14px;"></i> SPICE Models
                </div>
                <button type="button" id="btn-upload-model" style="background: var(--bg-panel); color: var(--text-main); border: 1px solid var(--border-main); padding: 2px 8px; border-radius: 3px; font-size: 10px; cursor: pointer; font-weight: 600;">Upload .lib</button>
                <input type="file" id="model-upload" style="display: none;" accept=".txt,.lib,.mod,.cir">
            </div>
            <textarea id="sim-models" style="width: 100%; height: 100px; font-family: var(--font-code); font-size: 12px; margin: 0; padding: 8px; box-sizing:border-box; border:1px solid var(--border-main); border-radius:3px; outline: none; background: var(--bg-panel); color: var(--text-main);" placeholder=".model 1N4148 D (IS=4.35E-9 N=1.9 RS=0.645)"></textarea>
        </div>

        <!-- CUSTOM DIRECTIVES -->
        <div style="padding: 12px; border: 1px solid var(--border-main); border-radius: 6px; background: var(--bg-app);">
            <div style="font-weight: 600; color: var(--text-main); margin-bottom: 10px; font-size: 12px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--border-main); padding-bottom: 6px;">
                <i data-lucide="settings-2" style="width: 14px; height: 14px;"></i> Directives (.options, .ic)
            </div>
            <textarea id="sim-custom" style="width: 100%; height: 50px; font-family: var(--font-code); font-size: 12px; margin: 0; padding: 8px; box-sizing:border-box; border:1px solid var(--border-main); border-radius:3px; outline: none; background: var(--bg-panel); color: var(--text-main);" placeholder=".options reltol=1e-5"></textarea>
        </div>
    </div>
</template>

</body>
</html>
